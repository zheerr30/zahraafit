  shouldertap:   {shoulders:1, abs:.5},
  mountain:      {abs:1, shoulders:.25, quads:.25}
};
function contribOf(e){
  if(CONTRIB_OVERRIDE[e.id]) return CONTRIB_OVERRIDE[e.id];
  if(e.type !== "compound") return {[e.group]:1};          // العزل: العضلة وحدها
  return CONTRIB_BY_GROUP[e.group] || {[e.group]:1};
}

/* ---------- 2. أولوية المؤخرة ---------- */
/* مطلب عملي: أغلب عميلات ZahraaFit يضعن المؤخرة أولوية أولى. */
const MUSCLE_PRIORITY = { glutes: 1.30, back: 1.30 };
/* الظهر أكبر عضلة في الجزء العلوي، وأغلب الجداول تعطيه حجماً أقل من الصدر
   بسبب طبيعة التقسيمة (٣ عضلات دفع مقابل ٢ سحب). رفعه يصلح النسبة من جذرها. */
function priorityOf(group){
  if(group==="glutes" && S.gluteEmphasis===false) return 1;
  return MUSCLE_PRIORITY[group] || 1;
}

/* ---------- 3. الحجم: فعّال + حد أدنى مباشر ---------- */
/* الحد الأدنى المباشر يمنع أن تُغطّى المؤخرة بالسكوات وحده دون أي هيب ثرست. */
const DIRECT_MIN_RATIO = { glutes: .50, default: .40 };
function directMinFor(group){
  return Math.round(targetWeeklySets(group) * (DIRECT_MIN_RATIO[group] || DIRECT_MIN_RATIO.default));
}
function volumeOf(plan){
  const eff={}, dir={};
  COVERAGE_MUSCLES.forEach(m=>{ eff[m]=0; dir[m]=0; });
  plan.forEach(d=>d.exercises.forEach(e=>{
    const c = contribOf(e);
    Object.keys(c).forEach(m=>{
      if(eff[m]===undefined) return;
      eff[m] += e.sets * c[m];
      if(m===e.group) dir[m] += e.sets;
    });
  }));
  COVERAGE_MUSCLES.forEach(m=>{ eff[m]=Math.round(eff[m]*10)/10; });
  return {eff, dir};
}

/* ---------- 4. الإحماء حسب عضلات اليوم ---------- */
const WARM_MAP = {
  chest:["wu_shoulders","wu_chest"], back:["wu_shoulders","wu_arms"],
  shoulders:["wu_shoulders","wu_arms"], biceps:["wu_arms"], triceps:["wu_arms"],
  quads:["wl_squat","wl_hip"], hams:["wl_ham","wl_hip"], glutes:["wl_bridge","wl_hip"],
  adductors:["wl_hip"], calves:["wl_squat"], abs:["wl_hip"]
};
function buildWarmup(day){
  const ids=[];
  day.groups.forEach(g=>(WARM_MAP[g]||[]).forEach(id=>{ if(!ids.includes(id)) ids.push(id); }));
  const items = ids.map(id=>WARM.find(w=>w.id===id)).filter(Boolean).slice(0,5);
  const firstCompound = day.exercises.find(e=>e.type==="compound") || day.exercises[0];
  return {
    general: "٥ دقائق مشي سريع أو دراجة ثابتة حتى يدفأ الجسم ويرتفع النفَس قليلاً.",
    items,
    ramp: firstCompound ? {
      exercise: firstCompound.name,
      sets: ["٥٠٪ من وزنك × ٨ تكرارات","٧٠٪ × ٥ تكرارات","٨٥٪ × ٣ تكرارات — ثم ابدئي المجموعات الفعلية"],
      note: "المجموعات التصاعدية تُؤدّى على أول تمرين مركّب فقط، ولا تُحتسب من مجموعات الجدول."
    } : null
  };
}

/* ---------- 5. الإطالة حسب عضلات اليوم ---------- */
function buildCooldown(day){
  const worked = new Set();
  day.exercises.forEach(e=>Object.keys(contribOf(e)).forEach(m=>{
    const c = contribOf(e)[m];
    if(c >= .5) worked.add(m);
  }));
  const items=[];
  worked.forEach(m=>{
    const pick = FLEX.filter(f=>f.group===m && !items.some(i=>i.id===f.id));
    if(pick.length) items.push(pick[0]);
  });
  return {
    items: items.slice(0,7),
    note: "٣٠ ثانية لكل وضعية، تنفّس بعمق ولا تصلي لحد الألم. الإطالة بعد التمرين وليس قبله."
  };
}

/* ---------- 6. تقرير الحجم المحدّث ---------- */
/* التقييم ثلاثي لا ثنائي: «مكتمل/ناقص» لا يفرّق بين عضلة عند هدفها بالضبط
   وأخرى عند ضعفه. المدربة تحتاج تعرف الجرعة لا مجرد نجاح/رسوب. */
function volumeGrade(eff, target){
  if(eff < target * 0.95) return {label:"خفيف",  color:"#d98a1f", key:"low"};
  if(eff < target * 1.60) return {label:"متوسط", color:"#1f9d57", key:"mid"};
  return                         {label:"عالي",  color:"#2563c9", key:"high"};
}
function volumeReport(plan){
  const {eff, dir} = volumeOf(plan);
  return COVERAGE_MUSCLES.map(m=>{
    const target=targetWeeklySets(m), dmin=directMinFor(m);
    return {
      muscle:m, target, dmin,
      effective:eff[m], direct:dir[m],
      freq: plan.filter(d=>d.exercises.some(e=>contribOf(e)[m]>=.5)).length,
      grade: volumeGrade(eff[m], target),
      ok: eff[m]>=target && dir[m]>=dmin
    };
  }).sort((a,b)=>b.effective-a.effective);
}
/* ============================================================
   ZahraaFit — طبقة الجودة v4
   1) التدرّج: كتلة 4 أسابيع بتدرّج مزدوج وأسبوع تفريغ
   2) تمرين المرساة: المركّب الأساسي يتكرّر في كل جلسة للعضلة
   3) سقف الحجم في الجلسة الواحدة (منع الحجم الضائع)
   4) تدقيق التوازن: سحب/دفع · خلفي/أمامي · شغل المؤخرة المباشر
   5) تنويع نطاق التكرارات بين جلستي العضلة
   ============================================================ */

/* ---------- 1. التدرّج ---------- */
const PROGRESSION = {
  strength: {
    method:"تدرّج خطّي",
    rule:"إذا أكملتِ كل المجموعات بالتكرارات المطلوبة وبتقنية سليمة، زيدي ٢.٥ كجم على تمارين العلوي و٥ كجم على السفلي في الجلسة القادمة."
  },
  hypertrophy: {
    method:"تدرّج مزدوج",
    rule:"ابقي على نفس الوزن حتى تصلي أعلى رقم في نطاق التكرارات في كل المجموعات. عندها فقط زيدي الوزن ٢.٥–٥٪ وارجعي لأسفل النطاق."
  },
  cutting: {
    method:"تثبيت الوزن وتقليل الراحة",
    rule:"الهدف الحفاظ على العضلة لا زيادتها. ثبّتي الأوزان وقلّلي الراحة ٥ ثوانٍ أسبوعياً، وإذا نزلت التكرارات كثيراً ارجعي للراحة الأطول."
  },
  general: {
    method:"تدرّج بالتكرارات",
    rule:"زيدي تكراراً واحداً كل أسبوع حتى تصلي أعلى النطاق، ثم زيدي الوزن قليلاً وارجعي لأسفله."
  }
};
/* موجة 4 أسابيع: تراكم ثم تفريغ. التفريغ ليس راحة سلبية بل نصف الحجم بنفس الوزن. */
const WEEK_WAVE = [
  {w:1, label:"تأسيس", setsMult:1.0,  rpe:"٦–٧", note:"اضبطي التقنية وسجّلي أوزان البداية. اتركي ٣–٤ تكرارات في الخزنة."},
  {w:2, label:"بناء",  setsMult:1.0,  rpe:"٧–٨", note:"نفس أوزان الأسبوع الأول أو أعلى قليلاً، وزيدي تكراراً حيث تقدرين."},
  {w:3, label:"تحميل", setsMult:1.15, rpe:"٨–٩", note:"أثقل أسبوع: مجموعة إضافية على التمارين المركّبة، وتكرار أو اثنان من الفشل."},
  {w:4, label:"تفريغ", setsMult:0.55, rpe:"٥–٦", note:"نصف الحجم بنفس الأوزان. هذا الأسبوع هو الذي يُظهر نتائج الثلاثة قبله."}
];
function progressionBlock(){
  const p = PROGRESSION[S.goal] || PROGRESSION.hypertrophy;
  return {
    method: p.method,
    rule: p.rule,
    weeks: WEEK_WAVE.map(x=>Object.assign({}, x)),
    after: "بعد الأسبوع الرابع: أعيدي التوليد لتغيير التمارين، واحتفظي بتمارين المرساة نفسها لتقيسي تقدّمك عليها."
  };
}

/* ---------- 2. سقف الجلسة ---------- */
/* تجاوز هذا الحد في الجلسة الواحدة يعطي عائداً متناقصاً (حجم ضائع). */
const SESSION_SET_CAP = { big: 12, small: 9 };
function sessionCapFor(g){ return BIG_GROUPS.includes(g) ? SESSION_SET_CAP.big : SESSION_SET_CAP.small; }

/* إزالة الحجم الزائد: عضلة تجاوزت هدفها بمقدار كبير بفضل التفعيل غير المباشر
   لا تحتاج كل تمارين العزل التي أُسندت لها. حذفها يقلّل الإرهاق ويصحّح
   نسبة الدفع/السحب من جذرها بدل ترقيعها بتمرين إضافي. */
function trimOvershoot(plan){
  let guard = 0;
  while(guard++ < 20){
    const {eff, dir} = volumeOf(plan);
    let best = null;
    plan.forEach(d=>d.exercises.forEach(e=>{
      if(e.type === "compound") return;                       // المركّب لا يُحذف أبداً
      const t = targetWeeklySets(e.group);
      if(eff[e.group] < t * 1.45) return;                     // لم تتجاوز بما يكفي
      if(dir[e.group] - e.sets < directMinFor(e.group)) return; // لا نكسر الحد المباشر
      if(eff[e.group] - e.sets < t) return;                    // ولا الهدف الفعّال
      const over = eff[e.group] / t;
      if(!best || over > best.over) best = {e, d, over};
    }));
    if(!best) break;
    best.d.exercises = best.d.exercises.filter(x=>x !== best.e);
  }
  return plan;
}

/* ---------- 3. تنويع نطاق التكرارات بين الجلستين ---------- */
/* الجلسة الأولى للعضلة أثقل، والثانية أعلى تكراراً. هذا يغطي محفّزي
   التوتر الميكانيكي والإجهاد الأيضي بدل الاعتماد على نطاق واحد. */
const REP_SHIFT = {
  "6–10":  "10–15",  "4–6":   "6–8",
  "10–12": "12–15",  "8–12":  "12–15",
  "10–15": "15–20",  "8–10":  "12–15",
  "12–15": "15–20",  "15–20": "12–15"
};
function shiftReps(reps){ return REP_SHIFT[reps] || reps; }

/* ---------- 4. تدقيق التوازن ---------- */
function balanceAudit(plan){
  const {eff, dir} = volumeOf(plan);
  /* يُقاس بنمط الحركة لا بمجموع حجم العضلات: عضلات الدفع الثلاث تُغذّي
     بعضها فيتضخّم رقمها صناعياً. عدّ المجموعات حسب النمط هو المقياس الصحيح. */
  let push=0, pull=0;
  plan.forEach(d=>d.exercises.forEach(e=>{
    if(e.pattern==="push") push += e.sets;
    if(e.pattern==="pull") pull += e.sets;
  }));
  const post = eff.hams  + eff.glutes;
  const ant  = eff.quads;
  const warn = [];

  /* الحد كان 1.15 فأطلق التحذير في 58% من الجداول — ونسبة 1.2:1 طبيعية تماماً.
     تحذير يظهر في أكثر من نصف المخرجات يصير ضجيجاً لا إشارة. 1.35 هو الميل الحقيقي. */
  if(push > pull * 1.35) warn.push({
    key:"pushpull",
    text:`مجموعات الدفع ${push} مقابل ${pull} للسحب. الخلل هنا يسحب الكتفين للأمام مع الوقت — يُفضّل أن يكون السحب مساوياً أو أعلى.`,
    fix:"أضيفي تمرين سحب أفقي (تجديف أو سحب للوجه)."
  });
  if(pull > push * 1.60) warn.push({
    key:"pullpush",
    text:`مجموعات السحب ${pull} مقابل ${push} للدفع — الفارق كبير في الاتجاه الآخر.`,
    fix:"أضيفي تمرين دفع (ضغط صدر أو ضغط كتف)."
  });
  if(ant > post * 1.30) warn.push({
    key:"quadham",
    text:`الفخذ الأمامي أعلى بكثير من الخلفي والمؤخرة (${Math.round(ant)} مقابل ${Math.round(post)}). هذه النسبة مرتبطة بضغط أعلى على الركبة.`,
    fix:"أضيفي تمرين مفصلة ورك (رفعة رومانية أو هيب ثرست)."
  });
  if(dir.glutes < directMinFor("glutes")) warn.push({
    key:"glutedirect",
    text:`شغل المؤخرة المباشر ${dir.glutes} مجموعة فقط. السكوات والطعنات تشغّلها لكنها لا تكفي وحدها لتشكيلها.`,
    fix:"أضيفي هيب ثرست أو جسر المؤخرة أو رفس خلفي."
  });
  if(eff.abs < 6) warn.push({
    key:"core",
    text:"حجم الكور منخفض. الكور القوي يحمي أسفل الظهر في السكوات والرفعات.",
    fix:"أضيفي بلانك أو خنفساء في نهاية أي يوم."
  });
  return warn;
}

/* ---------- 5. ورقة متابعة أسبوعية ---------- */
function trackingSheet(plan){
  return plan.map(d=>({
    day:d.title,
    rows:d.exercises.map(e=>({name:e.name, sets:e.sets, reps:e.reps, weight:"____", done:"☐"}))
  }));
}
/* ============================================================
   ZahraaFit — محرك التوليد v2
   القاعدة: الحجم الأسبوعي لكل عضلة هو الأصل.
   عدد التمارين اليومي نتيجة محسوبة، محصورة بين حدّين تحدّدهما المدربة.
   ------------------------------------------------------------
   يستبدل: SPLIT_SYSTEMS · exCountFor · minSetsFor · MIN_WEEKLY_SETS
            generate · ensureFullCoverage · ensureMinimumVolume
   يحتاج في S:  minDaily (افتراضي 4) · maxDaily (افتراضي 8)
   ============================================================ */

/* ---------- 1. الحجم الأسبوعي المستهدف لكل عضلة ---------- */
/* المرجع العملي: 10 مجموعات/أسبوع حد أدنى للنمو، و10–20 هو النطاق المنتج.
   المبتدئة تبدأ من الأسفل لأن استجابتها عالية والتعافي أهم من الحجم. */
/* ثلاث فئات لا فئتين: العضلة المساعدة (سمانة/داخلي/بطن) لا تحتاج حجم
   عضلة رئيسية، وفرضه عليها كان يخنق الأرجل داخل الحد الأقصى اليومي. */
const ACCESSORY_GROUPS = ["adductors","calves","abs"];
const WEEKLY_SETS_BASE = {
  1: { big: 10, small: 8,  acc: 6  },   // مبتدئة
  2: { big: 14, small: 10, acc: 8  },   // متوسطة
  3: { big: 18, small: 12, acc: 10 }    // متقدمة
};
const GOAL_VOL_MULT   = { strength:0.80, hypertrophy:1.00, cutting:1.00, general:0.80 };
const FOCUS_MULT_ON   = 1.30;   // عضلات منطقة التركيز
const FOCUS_MULT_OFF  = 0.80;   // البقية تنزل نحو حدها الأدنى ولا تُلغى أبداً
const VOLUME_FLOOR    = { big: 8,  small: 6,  acc: 5  };  // لا ينزل تحته مهما كانت الإعدادات
const VOLUME_CEIL     = { big: 20, small: 14, acc: 12 };
const CEIL_OVERRIDE   = { glutes: 24 };   // المؤخرة أولوية أولى — سقفها أعلى  // ولا يتجاوزه — فوقه حجم ضائع

function targetWeeklySets(group){
  const base = WEEKLY_SETS_BASE[S.level] || WEEKLY_SETS_BASE[2];
  const tier = BIG_GROUPS.includes(group) ? "big"
             : ACCESSORY_GROUPS.includes(group) ? "acc" : "small";
  let v = base[tier];
  v *= (GOAL_VOL_MULT[S.goal] ?? 1);
  const focus = (FOCUS[S.focus] && FOCUS[S.focus].muscles) || [];
  if(focus.length) v *= focus.includes(group) ? FOCUS_MULT_ON : FOCUS_MULT_OFF;
  v *= (typeof priorityOf==='function' ? priorityOf(group) : 1);   // أولوية المؤخرة
  const hi = CEIL_OVERRIDE[group] || VOLUME_CEIL[tier];
  return Math.min(hi, Math.max(VOLUME_FLOOR[tier], Math.round(v)));
}

/* ---------- 2. المجموعات والتكرارات لكل تمرين على حدة ---------- */
/* الخطأ في النسخة السابقة: رقم واحد لكل الجدول. السكوات والسمانة ما ينفع
   ينحطّون على نفس النطاق. هنا المركّب غير العزل، وحسب الهدف. */
const SET_SCHEME = {
  strength:    { compound:{sets:4,reps:"4–6",  rest:"2–3 د"},    isolation:{sets:3,reps:"8–10", rest:"90 ث"} },
  hypertrophy: { compound:{sets:4,reps:"6–10", rest:"90–120 ث"}, isolation:{sets:3,reps:"10–15",rest:"60–90 ث"} },
  cutting:     { compound:{sets:3,reps:"10–12",rest:"60 ث"},     isolation:{sets:3,reps:"15–20",rest:"30–45 ث"} },
  general:     { compound:{sets:3,reps:"8–12", rest:"60–90 ث"},  isolation:{sets:3,reps:"12–15",rest:"45–60 ث"} }
};
function schemeFor(e){
  const g = SET_SCHEME[S.goal] || SET_SCHEME.hypertrophy;
  const s = Object.assign({}, g[e.type==="compound" ? "compound" : "isolation"]);
  if(S.level===1 && e.type==="compound") s.sets = Math.max(2, s.sets-1); // المبتدئة تقلّ مجموعة على المركّب
  s.baseSets = s.sets;
  return s;
}
function avgSetsPerEx(){
  const g = SET_SCHEME[S.goal] || SET_SCHEME.hypertrophy;
  let v = (g.compound.sets + g.isolation.sets) / 2;
  if(S.level===1) v -= 0.5;
  return Math.max(2, v);
}

/* ---------- 3. التقسيمات ---------- */
/* قاعدة: لا يوم يحمل عضلات أكثر مما يقدر يخدمها فعلاً (5 مجموعات عضلية كحد أقصى).
   التقسيمة القديمة كانت تحط 8-9 عضلات في يوم واحد فتُرمى نصفها بصمت. */
const UPPER = ["chest","back","shoulders","biceps","triceps"];
const LOWER = ["quads","hams","glutes","adductors","calves"];

    }
  },
  ul:{

    days:{

      4:[ UPPER, LOWER.concat("abs"), UPPER, LOWER.concat("abs") ],
      5:[ UPPER, LOWER.concat("abs"), UPPER, LOWER.concat("abs"),
          ["chest","back","glutes","abs"] ],
      6:[ UPPER, LOWER.concat("abs"), UPPER, LOWER.concat("abs"), UPPER, LOWER.concat("abs") ]

      3:[ ["chest","back","quads","glutes","abs"],
          ["shoulders","back","hams","adductors","calves"],
          ["chest","back","quads","glutes","biceps","triceps"] ],
      4:[ ["chest","back","quads","glutes","abs"],
          ["shoulders","back","hams","adductors","calves"],
          ["chest","back","quads","glutes","biceps","triceps"],
          ["shoulders","back","hams","glutes","adductors","abs"] ],
      5:[ ["chest","back","quads","glutes","abs"],

    }

};

/* ---------- 4. أدوات الاختيار ---------- */
function dangerSet(){
  const d=new Set();
  S.conditions.forEach(cid=>{
    const c=CONDITIONS.find(x=>x.id===cid);
    if(c) c.avoid.forEach(r=>d.add(r));
  });
  return d;
}
function poolFor(group, danger){
  return EX.filter(e=>
    e.group===group &&
    e.env.includes(S.env) &&
    e.level<=S.level &&
    !S.no.has(e.id) &&
    !e.risk.some(r=>danger.has(r))
  );
}
/* ترتيب الأولوية — التصحيح الجوهري:
   المركّب يُفحص قبل نوع المعدة. في النسخة السابقة كانت المعدة أولاً،
   فيطلع يوم صدر كامل أجهزة بلا أي وزن حر. */
function isBandEx(e){ return e.id.startsWith("band") || e.name.includes("شريط") || e.name.includes("باند"); }
function isMachineEx(e){ return ["جهاز","كيبل","ماكينة","سميث"].some(k=>e.name.includes(k)); }
function equipRank(e){
  if(S.env==="gym"){                       // النادي: وزن حر → جهاز/كيبل → باند
    if(isBandEx(e))    return 2;
    if(isMachineEx(e)) return 1;
    return 0;
  }
  if(S.env==="home") return isBandEx(e) ? 1 : 0;
  return 0;
}
function sortPool(pool, used){
  return pool.slice().sort((a,b)=>{
    const fa=S.fav.has(a.id)?0:1, fb=S.fav.has(b.id)?0:1;
    if(fa!==fb) return fa-fb;                                        // 1) المفضّل
    const ca=a.type==="compound"?0:1, cb=b.type==="compound"?0:1;
    if(ca!==cb) return ca-cb;                                        // 2) مركّب قبل عزل
    const ua=used.has(a.id)?1:0, ub=used.has(b.id)?1:0;
    if(ua!==ub) return ua-ub;                                        // 3) تنويع
    return equipRank(a)-equipRank(b);                                // 4) المعدة
  });
}

/* ترتيب اليوم: الكبيرة قبل الصغيرة، والمساعدة بعد أساسيتها، والبطن آخر شي.
   يمنع أن يجي البايسبس قبل الظهر أو الترايسبس قبل الصدر. */
const GROUP_ORDER = ["quads","hams","glutes","chest","back","shoulders",
                     "adductors","calves","biceps","triceps","abs"];
function orderDay(list){
  return list.slice().sort((a,b)=>{
    const ga=GROUP_ORDER.indexOf(a.group), gb=GROUP_ORDER.indexOf(b.group);
    if(ga!==gb) return ga-gb;
    return (a.type==="compound"?0:1)-(b.type==="compound"?0:1);
  });
}

/* ---------- 5. التوليد ---------- */
function generate(){
  const danger = dangerSet();
  const sys    = SPLIT_SYSTEMS[S.split] || SPLIT_SYSTEMS.ppl;
  const split  = sys.days[S.days] || sys.days[4] || Object.values(sys.days)[0];
  const minDaily = S.minDaily ?? 0;
  const maxDaily = S.maxDaily ?? 8;

  /* أ) تكرار كل عضلة أسبوعياً — يُقرأ من التقسيمة نفسها */
  const freq = {};
  split.forEach(groups=>groups.forEach(g=>{ freq[g]=(freq[g]||0)+1; }));

  /* ب) الحصة المستهدفة لكل عضلة في الجلسة الواحدة
        = الحجم الأسبوعي ÷ التكرار ÷ متوسط المجموعات لكل تمرين */
  const perSession = {};
  const PRIMARY = ["chest","back","quads","hams","glutes"];
  const clamp = (g,n)=>Math.min(4, Math.floor(sessionCapFor(g)/avgSetsPerEx()), Math.max(1, Math.round(n)));

  // ب-1) العضلات الأساسية أولاً — هي التي تقود الجلسة
  PRIMARY.forEach(g=>{
    if(!freq[g]) return;
    perSession[g] = clamp(g, targetWeeklySets(g) / freq[g] / avgSetsPerEx());
  });

  /* ب-2) تقدير الحجم غير المباشر القادم من الأساسية، ثم خصمه من حصة المساعدة.
     بدون هذا الخصم يأخذ الكتف والترايسبس حصة كاملة فوق ما يصلهما من تمارين
     الصدر — فيتضخّم الدفع مقابل السحب ويظهر حجم ضائع. */
  const indirect = {};
  PRIMARY.forEach(g=>{
    if(!perSession[g]) return;
    const weekSets = perSession[g] * freq[g] * avgSetsPerEx();
    const c = CONTRIB_BY_GROUP[g] || {};
    Object.keys(c).forEach(m=>{ if(m!==g) indirect[m] = (indirect[m]||0) + weekSets*c[m]; });
  });

  Object.keys(freq).forEach(g=>{
    if(perSession[g]) return;                       // أساسية محسوبة مسبقاً
    const target = targetWeeklySets(g);
    const remaining = Math.max(directMinFor(g), target - (indirect[g]||0));
    perSession[g] = clamp(g, remaining / freq[g] / avgSetsPerEx());
  });

  /* ج) بناء الأيام */
  const used = new Set();
  const anchors = {};      // العضلة -> التمرين المركّب الأساسي (يتكرّر كل جلسة)
  const survives = {};                       // كم يوم بقيت فيه كل عضلة بحصة ≥1
  split.forEach(gr=>gr.forEach(g=>{ survives[g]=(survives[g]||0)+1; }));

  const seenBefore = {};   // كم مرة ظهرت العضلة حتى الآن (لتنويع نطاق التكرارات)
  const plan = split.map(groups=>{
    let quotas = groups.map(g=>perSession[g]);

    /* احترام الحد الأقصى — ترتيب القصّ:
       (أ) صغيرة فوق 1  (ب) كبيرة فوق 2  (ج) إسقاط عضلة صغيرة تظهر في يوم آخر
       (د) كبيرة إلى 1. هكذا لا تُجوَّع عضلة كبيرة بسبب سمانة أو بطن. */
    let total = quotas.reduce((a,b)=>a+b,0);
    while(total > maxDaily){
      let idx = -1;
      idx = groups.findIndex((g,i)=>!BIG_GROUPS.includes(g) && quotas[i]>1);
      if(idx<0) idx = groups.findIndex((g,i)=>BIG_GROUPS.includes(g) && quotas[i]>2);
      if(idx<0) idx = groups.findIndex((g,i)=>!BIG_GROUPS.includes(g) && quotas[i]===1 && survives[g]>1);
      if(idx>=0 && quotas[idx]===1) survives[groups[idx]]--;   // نسجّل الإسقاط حتى لا تُسقط من كل الأيام
      if(idx<0) idx = groups.findIndex((g,i)=>BIG_GROUPS.includes(g) && quotas[i]>1);
      /* (هـ) إن كان عدد العضلات في اليوم أكبر من الحد الأقصى نفسه، فلا مفر من
         إسقاط عضلة كاملة. نُسقط الأقل أولوية (بطن ← سمانة ← داخلي ← بايسبس/ترايسبس)
         ولا نتجاوز رقم المدربة أبداً. النقص يُبلَّغ في التقرير. */
      if(idx<0){
        const DROP_ORDER = ["abs","calves","adductors","biceps","triceps","shoulders"];
        for(const g of DROP_ORDER){
          const i = groups.indexOf(g);
          if(i>=0 && quotas[i]>0){ idx=i; break; }
        }
        /* وإن نفدت العضلات المساعدة، نُسقط الأدنى أولوية من الكبيرة أيضاً.
           رقم المدربة مطلق: يُنفَّذ حتى لو كلّف إسقاط عضلة، والنقص يُبلَّغ. */
        if(idx<0){
          for(let k=GROUP_ORDER.length-1;k>=0;k--){
            const i = groups.indexOf(GROUP_ORDER[k]);
            if(i>=0 && quotas[i]>0){ idx=i; break; }
          }
        }
        if(idx>=0) survives[groups[idx]]--;
      }
      if(idx<0) break;
      quotas[idx]--; total--;
    }
    // الحد الأدنى اختياري: صفر يعني لا إضافة قسرية
    while(minDaily > 0 && total < minDaily){
      let idx=-1, bestScore=-1;
      groups.forEach((g,i)=>{
        if(quotas[i]>=4) return;
        const avail = poolFor(g,danger).length;
        if(quotas[i]>=avail) return;       // ما فيه تمارين إضافية متاحة
        const score = (BIG_GROUPS.includes(g)?10:0) - quotas[i];
        if(score>bestScore){ bestScore=score; idx=i; }
      });
      if(idx<0) break;
      quotas[idx]++; total++;
    }

    // اختيار التمارين
    const picks=[];
    groups.forEach((g,gi)=>{
      const pool = sortPool(poolFor(g,danger), used);
      let added=0;

      /* تمرين المرساة: المركّب الأساسي للعضلة يتكرّر في كل جلسة لها.
         التنويع الكامل بين الجلستين يمنع قياس التقدّم — لا تعرفين هل قويتِ
         إذا كان كل أسبوع تمارين مختلفة. المرساة ثابتة والمساعدات تتنوّع. */
      if(freq[g] >= 2 && quotas[gi] >= 2){
        if(!anchors[g]){
          const a = pool.find(e=>e.type==="compound");
          if(a) anchors[g] = a.id;
        }
        const anchor = pool.find(e=>e.id===anchors[g]);
        if(anchor && !picks.includes(anchor)){
          picks.push(anchor); used.add(anchor.id); added++;
        }
      }

      for(const e of pool){                       // جولة 1: غير مستخدم (تنويع)
        if(added>=quotas[gi]) break;
        if(used.has(e.id)) continue;
        picks.push(e); used.add(e.id); added++;
      }
      for(const e of pool){                       // جولة 2: يسمح بالتكرار عند الشح
        if(added>=quotas[gi]) break;
        if(picks.includes(e)) continue;
        picks.push(e); added++;
      }
    });

    groups.forEach(g=>{ seenBefore[g] = (seenBefore[g]||0) + 1; });
    const ordered = orderDay(picks);
    return {
      groups,
      title: groups.map(gp=>DAY_NAMES[gp]).join(" + "),
      exercises: ordered.map(e=>{
        const sch = schemeFor(e);
        if(seenBefore[e.group] === 2) sch.reps = shiftReps(sch.reps);   // الجلسة الثانية أعلى تكراراً
        return Object.assign({}, e, sch, {video: videoLinks[e.id]||""});
      })
    };
  });

  /* د) طبقة التحقق — تقيس الحجم الفعلي وتصلّح النقص، وتصارح بما تعذّر */
  const report = verifyVolume(plan, danger, used, maxDaily);
  trimOvershoot(plan);
  plan.forEach(d=>{ d.warmup = buildWarmup(d); d.cooldown = buildCooldown(d); });
  report.balance     = balanceAudit(plan);
  report.progression = progressionBlock();
  report.tracking    = trackingSheet(plan);

  S.plan   = plan;
  S.report = report;
  S.weekly = computeWeeklyVolume(plan);
  go(3);
}

/* تحسب المجموعات الفعلية لكل عضلة وتقارنها بالمستهدف.
   النقص يُعالَج بإضافة تمرين في يوم تظهر فيه العضلة (ضمن الحد الأقصى)،
   وإن تعذّر تُرفع مجموعة واحدة على تمارينها، وإن تعذّر يُبلَّغ صراحة. */
function verifyVolume(plan, danger, used, maxDaily){
  const actual = () => volumeOf(plan).eff;        // الحجم الفعّال (يشمل التفعيل الجزئي)
  const direct = () => volumeOf(plan).dir;        // العمل المباشر فقط
  const shortfalls=[];
  const overflow=new Set();   // عضلات احتاجت تجاوز الحد الأقصى لتُغطّى

  COVERAGE_MUSCLES.forEach(muscle=>{
    const target = targetWeeklySets(muscle);
    let guard=0;

    /* 1) إضافة تمارين — تصعيد تلقائي على أربع مراحل حتى تُغطّى العضلة:
       أ) يوم يحتوي العضلة وفيه متّسع
       ب) يوم مناسب للطابع (علوي/سفلي) وفيه متّسع — ونضيف العضلة لعنوانه
       ج) تجاوز الحد الأقصى بتمرينين كحد أقصى بدل ترك العضلة ناقصة
       الفكرة: الحد الأقصى تفضيل، وتغطية العضلة ضرورة. */
    const LOWER_G = ["quads","hams","glutes","adductors","calves"];
    const short = () => (actual()[muscle]||0) < target || (direct()[muscle]||0) < directMinFor(muscle);
    const pickFor = () => {
      let pool = sortPool(poolFor(muscle,danger), used);
      if((direct()[muscle]||0) < directMinFor(muscle)) pool = pool.filter(e=>e.group===muscle);
      return pool.find(e=>!used.has(e.id));
    };
    const addTo = (day, pick) => {
      used.add(pick.id);
      day.exercises.push(Object.assign({}, pick, schemeFor(pick), {video:videoLinks[pick.id]||""}));
      day.exercises = orderDay(day.exercises);
      if(!day.groups.includes(muscle)){
        day.groups.push(muscle);
        day.title = day.groups.map(gp=>DAY_NAMES[gp]).join(" + ");
      }
    };
    const wantLower = LOWER_G.includes(muscle);

    while(short() && guard++ < 12){
      const pick = pickFor();
      if(!pick) break;                                  // لا يوجد تمرين متاح — نتوقف بصدق
      // أ) يوم يحتوي العضلة وفيه متّسع
      let day = plan.filter(d=>d.groups.includes(muscle) && d.exercises.length < maxDaily)
                    .sort((a,b)=>a.exercises.length-b.exercises.length)[0];
      /* ب) يوم مناسب للطابع وفيه متّسع.
         العضلات المساعدة (سمانة/بطن/فخذ داخلي) تُوضع في أي يوم فيه متّسع —
         رفع سمانة في يوم علوي لا يتعارض مع شيء، وتركها ناقصة يتعارض. */
      const freePlace = ACCESSORY_GROUPS.includes(muscle);
      if(!day) day = plan.filter(d=>d.exercises.length < maxDaily &&
                        (freePlace || d.groups.some(g=>LOWER_G.includes(g)===wantLower)))
                        .sort((a,b)=>a.exercises.length-b.exercises.length)[0];
      /* لا تجاوز للحد الأقصى. الرقم الذي تحدّده المدربة حدّ لا تفضيل،
         وإن تعذّرت التغطية داخله يُبلَّغ النقص ولا يُخالَف الطلب. */
      if(!day) break;
      addTo(day, pick);
    }

    /* 2) رفع مجموعة — موزّعة بالتساوي وبحد أقصى +1 فوق الوصفة الأصلية.
          آخر أداة قبل المصارحة: إذا امتلأت الأيام ولم تعد هناك تمارين متاحة،
          نرفع كثافة الموجود بدل ترك العضلة تحت هدفها. */
    guard = 0;
    while(short() && guard++ < 12){
      const cands = [];
      plan.forEach(d=>d.exercises.forEach(e=>{
        if(e.group===muscle && e.sets < (e.baseSets||e.sets)+1) cands.push(e);
      }));
      if(!cands.length) break;
      cands.sort((a,b)=>a.sets-b.sets)[0].sets++;
    }

    // 3) مصارحة
    const got = Math.round((actual()[muscle]||0)*10)/10;
    if(short()){
      const daysWith = plan.filter(d=>d.groups.includes(muscle)).length;
      const allFull  = plan.filter(d=>d.groups.includes(muscle)).every(d=>d.exercises.length>=maxDaily);
      const poolLeft = poolFor(muscle,danger).filter(e=>!used.has(e.id)).length;
      let fix;
      if(!poolLeft)        fix = "لا توجد تمارين إضافية متاحة لهذه العضلة في هذه البيئة/المستوى";
      else if(allFull)     fix = "ارفعي الحد الأقصى لعدد التمارين اليومي";
      else if(daysWith<2)  fix = "العضلة تظهر مرة واحدة أسبوعياً — زيدي عدد الأيام";
      else                 fix = "زيدي عدد الأيام أو ارفعي الحد الأقصى";
      shortfalls.push({muscle, got, target, direct:direct()[muscle]||0, dmin:directMinFor(muscle), fix});
    }
  });

  /* العضلة الغائبة كلياً: تُضاف في يوم يحمل نفس الطابع (علوي/سفلي) لا في أي يوم.
     وضع تمرين سفلي داخل يوم علوي يكسر منطق الجلسة. */
  const LOWER_SET = ["quads","hams","glutes","adductors","calves"];
  COVERAGE_MUSCLES.forEach(muscle=>{
    if((actual()[muscle]||0) > 0) return;
    const pool = sortPool(poolFor(muscle,danger), used);
    if(!pool.length) return;
    const wantLower = LOWER_SET.includes(muscle);
    const cand = plan
      .filter(d=>d.exercises.length < maxDaily)
      .sort((a,b)=>{
        const sameA = a.groups.some(g=>LOWER_SET.includes(g)===wantLower)?0:1;
        const sameB = b.groups.some(g=>LOWER_SET.includes(g)===wantLower)?0:1;
        return sameA-sameB || a.exercises.length-b.exercises.length;
      })[0];
    if(!cand) return;
    const pick = pool.find(e=>!used.has(e.id)) || pool[0];
    used.add(pick.id);
    cand.exercises.push(Object.assign({}, pick, schemeFor(pick), {video:videoLinks[pick.id]||""}));
    cand.exercises = orderDay(cand.exercises);
    if(!cand.groups.includes(muscle)){          // نحدّث العنوان حتى لا يكذب على العميلة
      cand.groups.push(muscle);
      cand.title = cand.groups.map(gp=>DAY_NAMES[gp]).join(" + ");
    }
  });

  // نصيحة بنيوية: تكرار 1× أسبوعياً لأغلب العضلات = التقسيمة غلط لعدد الأيام
  const freqs = COVERAGE_MUSCLES.map(m=>plan.filter(d=>d.exercises.some(e=>e.group===m)).length);
  const once  = freqs.filter(f=>f<=1).length;
  let advice = null;
  if(once >= 6)
    advice = "أغلب العضلات تظهر مرة واحدة أسبوعياً. التكرار مرتين أسبوعياً يعطي نمواً أفضل بنفس الحجم — جرّبي «فل بدي» بنفس عدد الأيام، أو زيدي يوماً.";
  else if(shortfalls.length){
    const names = shortfalls.map(s=>DAY_NAMES[s.muscle]||s.muscle).join("، ");
    advice = `بعد كل المحاولات التلقائية بقي نقص في: ${names}. ` +
      (plan.length <= 2
        ? "يومان في الأسبوع لا يتّسعان لحجم كل العضلات — أضيفي يوماً ثالثاً."
        : "ارفعي الحد الأقصى لعدد التمارين اليومي درجة واحدة، أو أضيفي يوماً.");
  }

  const fixes = [];
  if(overflow.size) fixes.push(`زِيد عدد تمارين بعض الأيام تجاوزاً للحد الأقصى لتغطية: ${[...overflow].map(m=>DAY_NAMES[m]||m).join("، ")}.`);
  return { advice, shortfalls, fixes, volume: volumeReport(plan) };
}

/* ============================================================
   ZahraaFit — صفحتا الإحماء والإطالة
   التركيب:
   1) في render():  S.step===11 ? screenWarmup() : S.step===12 ? screenFlex() : ""
   2) في topbar():  <button class="ghost-btn" data-act="warmup">🔥 الإحماء</button>
                    <button class="ghost-btn" data-act="flex">🧘 الإطالة والمرونة</button>
   3) في bind():    if(a==="warmup") go(11);   if(a==="flex") go(12);

/* ============================================================
   استيراد المشتركين من رابط خارجي (Google Sheets / Apps Script)
   يقبل CSV أو JSON، ويكتشف أسماء الأعمدة تلقائياً بالعربي والإنجليزي.
   إن منع الرابط القراءة من المتصفح (CORS) يوجد بديل اللصق اليدوي.
   ============================================================ */
let subsRows = [], subsCols = [], subsErr = "", subsLog = [];

/* --- محلّل CSV يحترم الفواصل داخل علامات الاقتباس والأسطر المتعددة --- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    } else if(ch === '"') q=true;
    else if(ch === ','){ row.push(cell); cell=""; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

/* --- اكتشاف الأعمدة: نبحث عن كلمة مفتاحية داخل اسم العمود --- */
const COL_HINTS = {
  name:    ["الاسم","اسم","name","الاسم الكامل"],
  age:     ["العمر","عمر","السن","age"],
  height:  ["الطول","طول","height"],
  weight:  ["الوزن","وزن","weight"],
  gender:  ["الجنس","جنس","gender","النوع"],
  env:     ["مكان","البيئة","بيئة","نادي","المكان","تتمرن","تتمرنين","environment","gym"],
  level:   ["المستوى","مستوى","level","الخبرة"],
  days:    ["الايام","الأيام","ايام","أيام","days","عدد الايام","عدد الأيام"],
  goal:    ["الهدف","هدف","goal","الغرض"],
  service: ["الاشتراك","نوع الاشتراك","الخدمة","نوع الطلب","الطلب","الباقة","المنتج","service","product"],
  status:  ["الحالة","الوضع","status","الانجاز","الإنجاز"],
  inbody:  ["inbody","انبودي","إنبودي","تحليل الجسم"],
  date:    ["التاريخ","الوقت","timestamp","تاريخ"],
  notes:   ["ملاحظات","تفضيلات","طلب خاص","تفاصيل","اصابات","إصابات","notes","comment"],
  phone:   ["الجوال","الهاتف","رقم","phone","whatsapp"]
};
function detectCols(header){
  const map={};
  header.forEach((raw,i)=>{
    const cell=String(raw||"").trim().toLowerCase();
    if(!cell) return;
    for(const key in COL_HINTS){
      if(map[key]!==undefined) continue;
      if(COL_HINTS[key].some(k=>cell.includes(String(k).toLowerCase()))){ map[key]=i; break; }
    }
  });
  return map;
}

/* --- تحويل النص العربي إلى قيم البرنامج --- */
const norm = s => String(s||"").trim();
function mapEnv(v){ v=norm(v);
  if(/وزن\s*الجسم|بدون\s*معد|bodyweight/i.test(v)) return "bodyweight";
  if(/بيت|منزل|home/i.test(v)) return "home";
  if(/نادي|جيم|صالة|gym/i.test(v)) return "gym";
  return null; }
function mapLevel(v){ v=norm(v);
  if(/مبتدئ|جديد|beginner/i.test(v)) return 1;
  if(/متوسط|intermediate/i.test(v)) return 2;
  if(/متقدم|advanced/i.test(v)) return 3;
  return null; }
function mapGoal(v){ v=norm(v);
  if(/تنشيف|حرق|خسارة|نزول|cut|fat/i.test(v)) return "cutting";
  if(/تضخيم|بناء|زيادة|عضل|hypertroph|muscle/i.test(v)) return "hypertrophy";
  if(/قوة|strength/i.test(v)) return "strength";
  if(/لياقة|عام|general|fitness/i.test(v)) return "general";
  return null; }
function mapGender(v){ return /ذكر|رجل|male|m$/i.test(norm(v)) ? "male" : "female"; }
function mapDays(v){ const n=parseInt(String(v).replace(/[^\d]/g,""),10); return (n>=2&&n<=6)?n:null; }

/* يبني صفاً موحّداً من سطر الجدول */
function rowToClient(row, cols){
  const g = k => cols[k]!==undefined ? norm(row[cols[k]]) : "";
  return {
    name:g("name"), age:g("age"), height:g("height"), weight:g("weight"),
    gender:mapGender(g("gender")), phone:g("phone"),
    status:g("status"), inbody:g("inbody"), date:g("date"),
    env:mapEnv(g("env")), level:mapLevel(g("level")), days:mapDays(g("days")),
    goal:mapGoal(g("goal")), notes:g("notes"), service:g("service"), _raw:row
  };
}

/* رابط Google Sheets له عدة صيغ، وواحدة فقط منها تُقرأ من المتصفح.
   الصيغة التي تنسخينها من شريط العنوان (edit#gid=..) تُرجع صفحة HTML لا بيانات،
   وصيغة export تمنع القراءة عبر CORS. لذلك نولّد المرشّحات ونجرّبها بالترتيب. */
function sheetCandidates(raw){
  const url = String(raw||"").trim();
  if(!url) return [];
  const out = [];
  const gid = (url.match(/[#&?]gid=(\d+)/) || [])[1] || "0";

  const pub = url.match(/\/spreadsheets\/d\/e\/([^\/]+)/);      // رابط منشور 2PACX
  if(pub){
    out.push(`https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?gid=${gid}&single=true&output=csv`);
  }
  const id = url.match(/\/spreadsheets\/d\/(?!e\/)([a-zA-Z0-9-_]+)/);   // معرّف الشيت العادي
  if(id){
    const s = id[1];
    out.push(`https://docs.google.com/spreadsheets/d/${s}/gviz/tq?tqx=out:csv&gid=${gid}`);
    out.push(`https://docs.google.com/spreadsheets/d/${s}/pub?gid=${gid}&single=true&output=csv`);
    out.push(`https://docs.google.com/spreadsheets/d/${s}/export?format=csv&gid=${gid}`);
  }
  out.push(url);                                                 // كما هو (Apps Script أو أي مصدر آخر)
  return [...new Set(out)];
}

/* يحاول عبر وسيط الخادم أولاً (يتجاوز CORS نهائياً بعد النشر) ثم مباشرة */
async function tryFetch(u){
  if(location.protocol !== "file:"){
    try{
      const r = await fetch("/api/sheet?url=" + encodeURIComponent(u), {cache:"no-store"});
      if(r.ok){ const t = await r.text(); if(t && t.trim()) return {text:t, via:"وسيط الخادم"}; }
    }catch(e){ /* الوسيط غير منشور — نكمل مباشرة */ }
  }
  const r = await fetch(u, {cache:"no-store"});
  if(!r.ok) throw new Error("الرمز " + r.status);
  const t = await r.text();
  if(!t || !t.trim()) throw new Error("رد فارغ");
  if(t.trim().startsWith("<")) throw new Error("رجع صفحة HTML لا بيانات — الورقة غير منشورة كـ CSV");
  return {text:t, via:"مباشر"};
}

async function fetchSubscribers(){
  const raw = norm(S.subsUrl);
  subsErr = ""; subsRows = []; subsLog = [];
  if(!raw){ subsErr = "الصقي الرابط أولاً."; render(); return; }

  const cands = sheetCandidates(raw);
  subsLog.push(`جاري تجربة ${cands.length} صيغة للرابط…`);
  render();

  for(const u of cands){
    const short = u.replace(/^https:\/\/docs\.google\.com\/spreadsheets\/d\//,"…/").slice(0,70);
    try{
      const {text, via} = await tryFetch(u);
      loadSubsFromText(text);
      if(subsRows.length){
        subsLog.push(`✅ نجح (${via}): ${short}`);
        try{ localStorage.setItem("zf_subs_url", raw); }catch(e){}
        render();
        return;
      }
      subsLog.push(`⚪ قُرئ لكن بلا صفوف: ${short}`);
    }catch(e){
      const why = /Failed to fetch|NetworkError|CORS/i.test(e.message)
        ? "المتصفح منع القراءة (CORS)" : e.message;
      subsLog.push(`❌ ${why}: ${short}`);
    }
  }
  subsErr = "لم تنجح أي صيغة. غالباً الورقة غير منشورة للعموم.";
  render();
}

function loadSubsFromText(txt){
  txt = String(txt||"").trim();
  /* Google Sheets gviz يغلّف الـJSON بنداء دالة — نقشّره أولاً */
  const gv = txt.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
  if(gv){
    const j = JSON.parse(gv[1]);
    const cols = (j.table.cols||[]).map(c=>c.label || c.id || "");
    const body = (j.table.rows||[]).map(r=>(r.c||[]).map(c=>c ? (c.f ?? c.v ?? "") : ""));
    subsCols = detectCols(cols);
    subsRows = body.map(r=>rowToClient(r, subsCols));
    subsErr = ""; render(); return;
  }
  let rows;
  if(txt.startsWith("{") || txt.startsWith("[")){
    const j = JSON.parse(txt);
    const arr = Array.isArray(j) ? j : (j.data || j.rows || j.records || []);
    if(!arr.length) throw new Error("لا توجد صفوف في الـ JSON");
    const keys = Object.keys(arr[0]);
    rows = [keys, ...arr.map(o=>keys.map(k=>o[k]))];
  } else {
    /* النسخ من Google Sheets أو Excel يأتي مفصولاً بـ Tab لا بفاصلة */
    const firstLine = txt.split("\n")[0] || "";
    const tabs = (firstLine.match(/\t/g)||[]).length;
    const commas = (firstLine.match(/,/g)||[]).length;
    rows = tabs > commas
      ? txt.split("\n").filter(l=>l.trim()).map(l=>l.split("\t"))
      : parseCSV(txt);
  }
  if(rows.length < 2) throw new Error("لا توجد بيانات كافية");
  subsCols = detectCols(rows[0]);
  subsRows = rows.slice(1).map(r=>rowToClient(r, subsCols));
  subsErr = "";
  render();
}

/* تطبيق مشترك على البرنامج ثم الانتقال لشاشة الإعداد */
function applySubscriber(i){
  const c = subsRows[i]; if(!c) return;
  S.client = {name:c.name, age:c.age, height:c.height, weight:c.weight, gender:c.gender};
  if(c.env)   S.env   = c.env;
  if(c.level) S.level = c.level;
  if(c.days)  S.days  = c.days;
  if(c.goal)  S.goal  = c.goal;
  if(c.notes) S.aiRequest = c.notes;
  go(1);
}

function subsFiltered(){
  const f = S.subsFilter || "workout";
  return subsRows.map((c,i)=>({c,i})).filter(({c})=>{
    if(f==="all") return true;

    if(f==="pending") return /تحت\s*العمل|قيد|جديد/.test(c.status||"");
    return true;
  });
}

          ٢. الصقي الرابط الناتج هنا (يحتوي على <code>/pub?</code>).<br>
          ٣. لو ظل يمنع: بعد نشر البرنامج على Vercel يعمل وسيط الخادم تلقائياً ويتجاوز المنع.<br>
          ٤. الحل الفوري دائماً: <b>📋 لصق يدوي</b> — افتحي الشيت، حدّدي الكل، انسخي، والصقي بالأسفل.
        </div>
      </div>`:""}

      ${S.subsPaste!==undefined?`
        <div class="field" style="margin-top:14px">
          <label>الصقي محتوى الجدول هنا (انسخي من الإكسل أو الشيت مباشرة)</label>
          <textarea id="subs-text" rows="7" placeholder="الاسم,العمر,المستوى,الهدف&#10;سارة,28,مبتدئ,تنشيف"></textarea>
        </div>
        <button class="btn dark" data-act="parsesubs">تحليل المُلصق</button>`:""}

      ${subsRows.length?`
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          ${[["workout","🏋️ طلبات الجدول الرياضي"],["pending","⏳ تحت العمل"],["all","الكل"]]
            .map(([k,l])=>`<button class="pchip ${(S.subsFilter||"workout")===k?'sel':''}" data-subfilter="${k}">${l}</button>`).join("")}
          <span style="align-self:center;color:var(--muted);font-size:12px">${shown.length} من ${subsRows.length}</span>
        </div>
        <div class="note" style="margin-top:12px">
          ✅ ${subsRows.length} صف · تعرّف على ${found} عمود:
          ${Object.keys(subsCols).map(k=>`<code style="background:#fff;padding:1px 6px;border-radius:5px;margin:0 2px">${k}</code>`).join("")}
        </div>
        <div style="margin-top:12px">${list}</div>`:""}
    </div>
  </div></div>`;
}

/* ---------- لوحة التقرير داخل شاشة الجدول ---------- */
function reportPanel(){
  const R = S.report;
  if(!R) return "";
  const nm = m => (DAY_NAMES[m]||m);
  const rows = R.volume.map(v=>`
    <tr>
      <td style="padding:6px 8px;font-weight:700">${nm(v.muscle)}</td>
      <td style="padding:6px 8px;text-align:center">${v.effective} <span style="color:var(--muted);font-size:12px">/ ${v.target}</span></td>
      <td style="padding:6px 8px;text-align:center;color:var(--muted)">${v.direct} / ${v.dmin}</td>
      <td style="padding:6px 8px;text-align:center">×${v.freq}</td>
      <td style="padding:6px 8px;text-align:center"><span style="background:${v.grade.color}1a;color:${v.grade.color};font-weight:800;font-size:12px;padding:3px 12px;border-radius:20px">${v.grade.label}</span></td>
    </tr>`).join("");

  const P = R.progression;
  const weeks = P.weeks.map(w=>`
    <div style="padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06)">
      <b>الأسبوع ${w.w} — ${w.label}</b>
      <small style="display:block;color:var(--muted);margin-top:2px">شدّة ${w.rpe} · حجم ${Math.round(w.setsMult*100)}٪ — ${w.note}</small>
    </div>`).join("");

  return `
  <div class="card no-print" style="margin-top:16px">
    <div class="sec-head"><div class="ico">📊</div><div>
      <h2 style="font-size:18px">تقرير الحجم الأسبوعي</h2>
      <p>الحجم الفعّال يشمل تفعيل العضلة في التمارين المركّبة</p>
    </div></div>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px">
      <tr style="color:var(--muted);font-size:12px;font-weight:800">
        <td style="padding:6px 8px">العضلة</td>
        <td style="padding:6px 8px;text-align:center">فعّال / هدف</td>
        <td style="padding:6px 8px;text-align:center">مباشر / أدنى</td>
        <td style="padding:6px 8px;text-align:center">تكرار</td>
        <td style="padding:6px 8px;text-align:center">الجرعة</td>
      </tr>${rows}
    </table>
    ${R.balance.length ? `<div style="margin-top:14px">
      ${R.balance.map(b=>`<div class="note" style="margin-bottom:8px"><b>⚠ ${b.text}</b><br><small>${b.fix}</small></div>`).join("")}
    </div>` : `<div class="note" style="margin-top:14px">✓ التوازن سليم: نسبة الدفع/السحب والأمامي/الخلفي وشغل المؤخرة المباشر ضمن النطاق.</div>`}
    ${R.shortfalls.length ? `<div class="note" style="margin-top:10px">
      <b>نقص لم يُعالَج:</b><br>
      ${R.shortfalls.map(s=>`• ${nm(s.muscle)} ${s.got}/${s.target} — ${s.fix}`).join("<br>")}
    </div>`:""}
    ${R.fixes && R.fixes.length ? `<div class="note" style="margin-top:10px"><b>🔧 صُحّح تلقائياً:</b> ${R.fixes.join(" ")}</div>`:""}
    ${R.advice ? `<div class="note" style="margin-top:10px"><b>اقتراح:</b> ${R.advice}</div>`:""}
    <div class="note" style="margin-top:10px;font-size:12.5px">
      <b>قراءة الجرعة:</b> <span style="color:#d98a1f;font-weight:800">خفيف</span> تحت الهدف · 
      <span style="color:#1f9d57;font-weight:800">متوسط</span> النطاق المنتج · 
      <span style="color:#2563c9;font-weight:800">عالي</span> أعلى من الهدف بمقدار كبير (مقصود في عضلة الأولوية).
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="sec-head"><div class="ico">📈</div><div>
      <h2 style="font-size:18px">التدرّج — كتلة 4 أسابيع</h2>
      <p>${P.method}</p>
    </div></div>
    <div class="note" style="margin:10px 0">${P.rule}</div>
    ${weeks}
    <small style="display:block;color:var(--muted);margin-top:10px">${P.after}</small>
  </div>`;
}

loadStored();
probeRemoteImages();
S.step=-1;
render();

</script>
</body>
</html>
