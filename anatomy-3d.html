<title>أطلس الجسم التشريحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&family=Spectral:ital,wght@1,400;1,500&display=swap">
<style>
/* Layout: full-height atlas app; control rail on the reading side, 3D stage fills the rest, specimen card floats over the stage */
:root{
  --bg:#e9ecee;
  --surface:#f9fafa;
  --stage-hi:#ffffff;
  --stage-lo:#dfe3e6;
  --ink:#1a1e22;
  --muted:#5b646d;
  --line:#d3d8dc;
  --accent:#d6402a;
  --accent-ink:#ffffff;
  --accent-soft:#f6ddd7;
  --chip:#eef0f1;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-latin:"Spectral",Georgia,"Times New Roman",serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315;--surface:#171b1e;--stage-hi:#20262a;--stage-lo:#0d1012;--ink:#e7eaec;--muted:#98a2ab;--line:#2a3136;
  --accent:#ff5b40;--accent-ink:#1a0d0a;--accent-soft:#3a1d18;--chip:#20262a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315;--surface:#171b1e;--stage-hi:#20262a;--stage-lo:#0d1012;--ink:#e7eaec;--muted:#98a2ab;--line:#2a3136;
  --accent:#ff5b40;--accent-ink:#1a0d0a;--accent-soft:#3a1d18;--chip:#20262a;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;line-height:1.55}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:0;text-wrap:balance}
header .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-latin);font-style:italic;direction:ltr}
header p{margin:0;color:var(--muted);font-size:.88rem}

aside{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h2{font-size:.74rem;font-weight:600;color:var(--muted);margin:0;letter-spacing:.04em}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tog{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:transparent;cursor:pointer;font-size:.86rem;text-align:start}
.tog .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.tog[aria-pressed="true"]{background:var(--chip);border-color:var(--ink)}
.tog[aria-pressed="true"] .dot{background:var(--sw);border-color:var(--sw)}
.range{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-variant-numeric:tabular-nums;min-width:3ch;text-align:end;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;border:0;background:transparent;cursor:pointer;font-size:.84rem}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.list{display:flex;flex-direction:column;gap:2px}
.list h3{font-size:.7rem;color:var(--muted);font-weight:500;margin:10px 0 4px;letter-spacing:.04em}
.list h3:first-child{margin-top:0}
.item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 8px;border:0;border-radius:7px;background:transparent;cursor:pointer;text-align:start;font-size:.9rem}
.item:hover{background:var(--chip)}
.item .la{font-family:var(--f-latin);font-style:italic;color:var(--muted);font-size:.78rem;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.item[aria-current="true"]{background:var(--accent-soft)}
.item[aria-current="true"] .ar{color:var(--accent);font-weight:600}

.main{position:relative;min-height:0;min-width:0}
.stage{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse 60% 70% at 50% 42%,var(--stage-hi),var(--stage-lo))}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.hud{position:absolute;top:12px;inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .seg{background:var(--surface)}
.hint{font-size:.76rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.8rem;padding:3px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-140%)}

.info{position:absolute;bottom:14px;left:14px;width:min(390px,calc(100% - 28px));max-height:calc(100% - 80px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 10px 30px rgb(0 0 0 / .12)}
.info .top{display:flex;gap:12px;align-items:flex-start}
.info .thumb{width:84px;aspect-ratio:590/640;flex:none;border-radius:8px;background:var(--stage-hi);object-fit:contain;max-width:100%}
.info .kind{font-size:.7rem;color:var(--accent);font-weight:600;letter-spacing:.04em}
.info h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;line-height:1.3;text-wrap:balance}
.info .latin{font-family:var(--f-latin);font-style:italic;color:var(--muted);direction:ltr;text-align:right;font-size:.95rem}
.info p{margin:0;font-size:.9rem}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem}
.info dt{color:var(--muted)}
.info dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.78rem;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.info .lbl{font-size:.72rem;color:var(--muted);font-weight:600}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .main{order:1;display:flex;flex-direction:column;gap:12px}
  aside{order:2;overflow:visible}
  .stage{position:relative;inset:auto;height:62svh;min-height:380px}
  .info{position:static;width:auto;max-height:none;box-shadow:none}
  header h1{font-size:1.35rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>أطلس الجسم التشريحي</h1>
    <span class="eyebrow">ZahraaFit · Atlas anatomicus</span>
    <p>اضغطي على أي عضلة أو عظم أو عضو لمعرفة اسمه ووظيفته.</p>
  </header>

  <aside aria-label="أدوات النموذج">
    <div class="sec">
      <h2>الطبقات</h2>
      <div class="toggles">
        <button class="tog" id="t-skin" aria-pressed="false" style="--sw:#d9a98c"><span class="dot"></span>الجلد</button>
        <button class="tog" id="t-muscles" aria-pressed="true" style="--sw:#c0473a"><span class="dot"></span>العضلات</button>
        <button class="tog" id="t-bones" aria-pressed="true" style="--sw:#d8ccb0"><span class="dot"></span>الهيكل العظمي</button>
        <button class="tog" id="t-organs" aria-pressed="false" style="--sw:#b85a6a"><span class="dot"></span>الأعضاء</button>
      </div>
      <label class="range" for="opacity">شفافية العضلات
        <input type="range" id="opacity" min="10" max="100" value="100">
        <output id="opacity-out">100٪</output>
      </label>
      <div class="seg" role="group" aria-label="ألوان العضلات">
        <button id="c-atlas" aria-pressed="true">أسلوب الأطلس</button>
        <button id="c-real" aria-pressed="false">ألوان طبيعية</button>
      </div>
    </div>
    <div class="sec">
      <div class="seg" role="tablist" aria-label="القوائم">
        <button id="tab-muscle" aria-pressed="true">العضلات</button>
        <button id="tab-bone" aria-pressed="false">العظام</button>
        <button id="tab-organ" aria-pressed="false">الأعضاء</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </aside>

  <main class="main">
    <div class="stage" id="stage">
      <div class="hud">
        <div class="seg" role="group" aria-label="زاوية العرض">
          <button id="v-front" aria-pressed="true">أمامي</button>
          <button id="v-side" aria-pressed="false">جانبي</button>
          <button id="v-back" aria-pressed="false">خلفي</button>
          <button id="v-focus" aria-pressed="false">تقريب</button>
          <button id="v-spin" aria-pressed="false">دوران</button>
        </div>
        <span class="hint">اسحبي للتدوير · مرّري أو قرّبي بإصبعين للتكبير</span>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <section class="info" id="info" aria-live="polite"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function gyriTex(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');

SIDES.forEach(s=>add('o_lungs', tube([v(0,1.372,0),v(s*.03,1.35,-.005),v(s*.055,1.32,-.01)],.006,12)));
add('o_heart', ell(v(.022,1.265,.034),[.044,.056,.04],[0,-.3,-.55]));
add('o_heart', tube([v(.01,1.3,.035),v(.005,1.37,.03),v(.02,1.395,.0),v(.026,1.36,-.045),v(.022,1.2,-.052),v(.018,1.0,-.046)],.0105,48,new THREE.MeshStandardMaterial({color:C(0xb02a2a),roughness:.4})));
add('o_heart', tube([v(-.026,1.0,-.03),v(-.028,1.15,-.02),v(-.024,1.29,.012),v(-.02,1.38,.02)],.011,32,veinMat));
add('o_liver', ell(v(-.05,1.152,.02),[.098,.054,.072],[0,0,.2]));
add('o_liver', ell(v(.03,1.165,.04),[.05,.032,.04],[0,0,-.1]));
add('o_stomach', ell(v(.065,1.135,.034),[.048,.054,.036],[0,0,-.55]));
add('o_stomach', spindle(v(.075,1.1,.04),v(-.01,1.085,.05),fus(.022,.3)));
{ // small intestine: serpentine coil
  const pts=[]; const rows=7;
  for(let r=0;r<rows;r++){ const y=1.035-r*.019; for(let k=0;k<=6;k++){ const f=k/6; const x=(r%2?1:-1)*(-.068+.136*f); pts.push(v(x,y+Math.sin(f*Math.PI*3)*.006,.05+Math.sin(f*Math.PI*2+r)*.012)); } }
  add('o_intestine', tube(pts,.0125,260));
  add('o_intestine', tube([v(-.095,.93,.03),v(-.102,1.02,.032),v(-.09,1.082,.035),v(0,1.075,.055),v(.09,1.082,.035),v(.102,1.02,.032),v(.094,.93,.03),v(.05,.9,.025),v(.01,.905,.0)],.019,80,new THREE.MeshStandardMaterial({color:C(0xc98a6e),roughness:.5})));
}
SIDES.forEach(s=>add('o_kidneys', ell(v(s*.062,1.11,-.066),[.024,.044,.017],[0,s*.4,-s*.2])));
add('o_bladder', ell(v(0,.888,.042),[.03,.026,.028]));

/* ---------------- Skin ---------------- */
const skinParts=[];
function sk(m){ m.material=skinMat; m.renderOrder=10; L.skin.add(m); skinParts.push(m); }
sk(ell(v(0,1.645,.002),[.085,.112,.1]));
sk(spindle(v(0,1.43,-.02),v(0,1.6,-.01),limb(.055,.05),{mat:skinMat}));
{ // torso
  const prof=t=>{ const y=.82+t*.66; const K=[[.82,.13],[.9,.17],[.96,.168],[1.06,.138],[1.2,.152],[1.32,.17],[1.41,.19],[1.45,.15],[1.48,.06]];
    for(let i=0;i<K.length-1;i++){ if(y<=K[i+1][0]){ const f=(y-K[i][0])/(K[i+1][0]-K[i][0]); const e=f*f*(3-2*f); return K[i][1]+(K[i+1][1]-K[i][1])*e; } } return .06; };
  const g=latheGeo(.66,prof,40,40); g.scale(1,1,.66); const m=new THREE.Mesh(g,skinMat); m.position.set(0,.82,-.005); sk(m);
}
SIDES.forEach(s=>{
  sk(spindle(v(s*.188,1.42,-.005),v(s*.246,1.09,-.02),limb(.054,.04,.008,.35),{mat:skinMat}));
  sk(spindle(v(s*.244,1.13,-.02),v(s*.292,.85,.02),limb(.044,.028,.006,.2),{mat:skinMat}));
  sk(ell(v(s*.3,.79,.028),[.036,.07,.016]));
  sk(spindle(v(s*.09,.98,-.005),v(s*.096,.47,.01),limb(.092,.055,.004,.2),{mat:skinMat}));
  sk(spindle(v(s*.096,.53,.0),v(s*.095,.055,-.012),limb(.052,.03,.016,.32),{mat:skinMat}));
  sk(ell(v(s*.1,.032,.04),[.04,.032,.11]));
});

/* ---------------- Floor & height scale ---------------- */
{
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,64); gr.addColorStop(0,'rgba(0,0,0,.28)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(.75,.75), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2; sh.position.y=.001; scene.add(sh);
}
const ruler = new THREE.Group(); scene.add(ruler);
function buildRuler(){
  ruler.clear();
  const col = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#888';
  const pts=[v(0,0,0),v(0,1.8,0)];
  for(let cm=0;cm<=180;cm+=10){ const y=cm/100, w=cm%50===0?.04:.02; pts.push(v(0,y,0),v(w,y,0)); }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  ruler.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:.7})));
  [0,50,100,150].forEach(cm=>{
    const c=document.createElement('canvas'); c.width=128; c.height=48; const x=c.getContext('2d');
    x.fillStyle=col; x.font='500 28px "IBM Plex Sans Arabic", system-ui, sans-serif'; x.textAlign='left'; x.textBaseline='middle'; x.fillText(cm+' سم',4,24);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
    sp.scale.set(.16,.06,1); sp.position.set(.13,cm/100,0); ruler.add(sp);
  });
  ruler.position.set(-.5,0,0);
}
buildRuler();

/* ---------------- Camera control ---------------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cam = {theta:.35, phi:1.48, dist:4.2, target:v(0,.92,0)};
const goal = {theta:.35, phi:1.48, dist:4.2, target:v(0,.92,0)};
let spin = !reduce, homeDist = 4.2;
function fitDist(){
  const a=camera.aspect, half=THREE.MathUtils.degToRad(camera.fov/2);
  const dv=1.0/Math.tan(half), dh=.62/(Math.tan(half)*a);
  return Math.max(dv,dh)*1.08;
}
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  const nd=fitDist(); if(Math.abs(goal.dist-homeDist)<.01){ goal.dist=nd; cam.dist=nd; } homeDist=nd;
}
new ResizeObserver(resize).observe(stage); resize();
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function setView(theta, opts={}){
  goal.theta = cam.theta + wrap(theta - cam.theta);
  if(opts.phi!=null) goal.phi=opts.phi;
  if(opts.dist!=null) goal.dist=opts.dist;
  if(opts.target) goal.target.copy(opts.target);
}

const el = renderer.domElement;
const pointers = new Map(); let downAt=null, moved=0, pinch0=0;
el.addEventListener('pointerdown',e=>{
  el.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  downAt={x:e.clientX,y:e.clientY}; moved=0; stopSpin();
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); }
  el.classList.add('dragging');
});
el.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);
  if(!p){ hover(e); return; }
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if(pointers.size===1){
    if(e.shiftKey || e.buttons===2){ goal.target.y=THREE.MathUtils.clamp(goal.target.y+dy*.0025*goal.dist/3,.1,1.75); }
    else { goal.theta-=dx*.008; goal.phi=THREE.MathUtils.clamp(goal.phi-dy*.006,.25,2.9); }
  } else if(pointers.size===2){
    const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0){ goal.dist=THREE.MathUtils.clamp(goal.dist*pinch0/d,.6,8); } pinch0=d;
  }
  tip.hidden=true;
});
function up(e){
  pointers.delete(e.pointerId); if(pointers.size<2) pinch0=0;
  if(pointers.size===0){ el.classList.remove('dragging'); if(downAt && moved<6) pick(e); downAt=null; }
}
el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
el.addEventListener('pointerleave',()=>{ tip.hidden=true; setHover(null); });
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('wheel',e=>{ e.preventDefault(); stopSpin(); goal.dist=THREE.MathUtils.clamp(goal.dist*Math.exp(e.deltaY*.0012),.6,8); },{passive:false});

/* ---------------- Picking ---------------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let muscleOpacity=1;
function pickables(){
  const out=[];
  if(L.muscles.visible && muscleOpacity>.45) out.push(...L.muscles.children);
  if(L.bones.visible) out.push(...L.bones.children);
  if(L.organs.visible) out.push(...L.organs.children);
  return out;
}
function hit(e){
  const r=el.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(pickables(),false)[0];
  return h ? h.object.userData.id : null;
}
const tip=document.getElementById('tip');
let hovered=null, selected=null;
function hover(e){
  if(e.pointerType==='touch') return;
  const id=hit(e); setHover(id);
  if(id){ const r=stage.getBoundingClientRect(); tip.textContent=DATA[id].ar; tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.hidden=false; el.style.cursor='pointer'; }
  else { tip.hidden=true; el.style.cursor=''; }
}
function pick(e){ const id=hit(e); if(id) select(id,{move:false}); }

/* ---------------- Highlight ---------------- */
function paint(id){
  const g=groups[id]; if(!g) return; const P=PALETTE[palette];
  if(g.kind==='m'){ g.mat.color.copy(C(id===selected?P.sel:P.muscle)); g.mat.emissive.copy(C(id===selected?P.selE:id===hovered?P.hov:0)); }
  else { g.mat.emissive.copy(C(id===selected?0x9a2810:id===hovered?0x3a1c10:0)); }
}
function setHover(id){ if(id===hovered) return; const prev=hovered; hovered=id; if(prev) paint(prev); if(id) paint(id); }
function repaintAll(){ Object.keys(groups).forEach(paint); }

function centerOf(id){ const b=new THREE.Box3(); groups[id].meshes.forEach(m=>b.expandByObject(m)); return b.getCenter(new THREE.Vector3()); }

const LAYER_OF={m:'muscles',b:'bones',o:'organs'};
function select(id,{move=true}={}){
  const prev=selected; selected=id; if(prev) paint(prev); paint(id);
  const d=DATA[id];
  // make sure its layer is visible and reachable
  const layer=LAYER_OF[d.k];
  if(!L[layer].visible) setLayer(layer,true);
  if(d.k!=='m' && L.muscles.visible && muscleOpacity>.5){ setOpacity(d.k==='o'?20:35); }
  if(d.k==='m' && muscleOpacity<.6) setOpacity(100);
  if(move){ stopSpin(); const c=centerOf(id); setView(d.view,{dist:Math.min(homeDist,1.9),target:v(0,c.y,0),phi:1.5}); }
  renderInfo(id); renderList();
}

/* ---------------- UI ---------------- */
const info=document.getElementById('info');
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderInfo(id){
  const d=DATA[id];
  let h=`<div class="top">${d.img?`<img class="thumb" src="img/${id}.png" alt="${esc(d.ar)} في رسم توضيحي" onerror="this.remove()">`:''}
    <div style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="kind">${KIND[d.k]}${d.r?' · '+d.r:''}</span><h2>${esc(d.ar)}</h2><div class="latin">${esc(d.la)}</div></div></div>
    <p>${esc(d.fn)}</p>`;
  if(d.k==='m'){
    h+=`<dl><dt>المنشأ</dt><dd>${esc(d.o)}</dd><dt>المُدغَم</dt><dd>${esc(d.i)}</dd></dl>
      <div class="lbl">تمارين مقترحة</div><div class="chips">${d.ex.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
  } else {
    h+=`<dl><dt>معلومة</dt><dd>${esc(d.fact)}</dd></dl>`;
  }
  info.innerHTML=h;
}
let tab='m';
const listEl=document.getElementById('list');
function renderList(){
  let h='', region=null;
  ORDER[tab].forEach(id=>{ const d=DATA[id];
    if(d.r && d.r!==region){ region=d.r; h+=`<h3>${esc(region)}</h3>`; }
    h+=`<button class="item" data-id="${id}" aria-current="${id===selected}"><span class="ar">${esc(d.ar)}</span><span class="la">${esc(d.la)}</span></button>`; });
  listEl.innerHTML=h;
}
listEl.addEventListener('click',e=>{ const b=e.target.closest('.item'); if(b) select(b.dataset.id); });
['m','b','o'].forEach(k=>{
  const b=document.getElementById('tab-'+{m:'muscle',b:'bone',o:'organ'}[k]);
  b.addEventListener('click',()=>{ tab=k; document.querySelectorAll('[id^="tab-"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderList(); });
});

function setLayer(name,on){ L[name].visible=on; document.getElementById('t-'+name).setAttribute('aria-pressed',on); }
['skin','muscles','bones','organs'].forEach(n=>document.getElementById('t-'+n).addEventListener('click',()=>{ setLayer(n,!L[n].visible); if(n==='skin'&&L.skin.visible){} }));

const op=document.getElementById('opacity'), opOut=document.getElementById('opacity-out');
function setOpacity(val){
  op.value=val; muscleOpacity=val/100; opOut.textContent=Math.round(val)+'٪';
  Object.values(groups).forEach(g=>{ if(g.kind!=='m') return; g.mat.transparent=muscleOpacity<.999; g.mat.opacity=muscleOpacity; g.mat.depthWrite=muscleOpacity>.95; g.mat.needsUpdate=true; });
  tendonMat.transparent=muscleOpacity<.999; tendonMat.opacity=muscleOpacity; tendonMat.depthWrite=muscleOpacity>.95; tendonMat.needsUpdate=true;
}
op.addEventListener('input',()=>setOpacity(+op.value));

function setPalette(p){ palette=p; document.getElementById('c-atlas').setAttribute('aria-pressed',p==='atlas'); document.getElementById('c-real').setAttribute('aria-pressed',p==='real'); repaintAll(); }
document.getElementById('c-atlas').addEventListener('click',()=>setPalette('atlas'));
document.getElementById('c-real').addEventListener('click',()=>setPalette('real'));

const vb={front:document.getElementById('v-front'),side:document.getElementById('v-side'),back:document.getElementById('v-back')};
function markView(k){ Object.entries(vb).forEach(([n,b])=>b.setAttribute('aria-pressed',n===k)); }
vb.front.addEventListener('click',()=>{ stopSpin(); setView(0,{phi:1.48,dist:homeDist,target:v(0,.92,0)}); markView('front'); });
vb.side.addEventListener('click',()=>{ stopSpin(); setView(Math.PI/2,{phi:1.48,dist:homeDist,target:v(0,.92,0)}); markView('side'); });
vb.back.addEventListener('click',()=>{ stopSpin(); setView(Math.PI,{phi:1.48,dist:homeDist,target:v(0,.92,0)}); markView('back'); });
document.getElementById('v-focus').addEventListener('click',()=>{ if(selected) select(selected); });
const spinBtn=document.getElementById('v-spin');
function stopSpin(){ spin=false; spinBtn.setAttribute('aria-pressed','false'); }
spinBtn.addEventListener('click',()=>{ spin=!spin; spinBtn.setAttribute('aria-pressed',spin); });
spinBtn.setAttribute('aria-pressed',spin);

// theme changes → ruler colour
const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change',buildRuler);
new MutationObserver(buildRuler).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------------- Loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(spin) goal.theta+=dt*.35;
  const k=1-Math.exp(-dt*(reduce?60:9));
  cam.theta+=(goal.theta-cam.theta)*k; cam.phi+=(goal.phi-cam.phi)*k; cam.dist+=(goal.dist-cam.dist)*k; cam.target.lerp(goal.target,k);
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.dist*sp*Math.sin(cam.theta), cam.target.y+cam.dist*Math.cos(cam.phi), cam.target.z+cam.dist*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
selected='chest'; repaintAll(); renderInfo('chest'); renderList();
requestAnimationFrame(frame);
}
</script>
