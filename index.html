<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZahraaFit — مولّد الجداول الرياضية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --navy:#0f1f3d;
  --navy-2:#16294b;
  --navy-3:#1f3661;
  --orange:#e8622c;
  --orange-2:#ff7a3d;
  --orange-soft:rgba(232,98,44,0.12);
  --cream:#f7f4ef;
  --ink:#0f1f3d;
  --muted:#6a7488;
  --line:rgba(15,31,61,0.10);
  --white:#ffffff;
  --ok:#2e9e6b;
  --warn:#d98a1f;
  --shadow:0 10px 40px rgba(15,31,61,0.10);
  --shadow-lg:0 24px 70px rgba(15,31,61,0.18);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:800;line-height:1.25}
.app{max-width:1180px;margin:0 auto;padding:0 18px 80px}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 22px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--orange-2));display:grid;place-items:center;font-family:'Cairo';font-weight:900;color:#fff;font-size:20px;box-shadow:0 6px 18px rgba(232,98,44,.45)}
.brand b{font-family:'Cairo';font-weight:900;font-size:20px;letter-spacing:.3px}
.brand b span{color:var(--orange-2)}
.brand small{display:block;color:#aebbd6;font-size:11px;font-weight:500;margin-top:-3px}
.topbar .right{display:flex;gap:10px;align-items:center}
.ghost-btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16);padding:9px 16px;border-radius:12px;font-family:'Tajawal';font-weight:700;font-size:14px;cursor:pointer;transition:.18s}
.ghost-btn:hover{background:rgba(255,255,255,.16)}

/* ===== Stepper ===== */
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px auto 8px;max-width:760px}
.step-pill{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:40px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted);box-shadow:0 3px 12px rgba(15,31,61,.05);transition:.2s}
.step-pill .n{width:23px;height:23px;border-radius:50%;background:#eef0f4;color:var(--muted);display:grid;place-items:center;font-family:'Cairo';font-weight:800;font-size:12.5px}
.step-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.step-pill.active .n{background:var(--orange);color:#fff}
.step-pill.done{color:var(--navy)}
.step-pill.done .n{background:var(--ok);color:#fff}

/* ===== Cards / sections ===== */
.screen{display:none;animation:fade .4s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:30px}
.card+.card{margin-top:20px}
.sec-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px}
.sec-head .ico{flex:none;width:46px;height:46px;border-radius:14px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-size:22px}
.sec-head h2{font-size:22px}
.sec-head p{color:var(--muted);font-size:14.5px;font-weight:500}
.eyebrow{display:inline-block;color:var(--orange);font-weight:800;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-family:'Cairo'}

/* ===== Hero ===== */
.hero{margin-top:26px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 55%,var(--navy-3) 100%);border-radius:26px;color:#fff;padding:46px 40px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero:after{content:"";position:absolute;left:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,44,.35),transparent 70%)}
.hero:before{content:"";position:absolute;right:-60px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,61,.18),transparent 70%)}
.hero-in{position:relative;z-index:2;max-width:620px}
.hero h1{font-size:38px;margin:10px 0 14px}
.hero h1 span{color:var(--orange-2)}
.hero p{color:#c4cfe6;font-size:16px;font-weight:500;margin-bottom:26px}
.hero .cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;border:none;padding:15px 30px;border-radius:14px;font-family:'Cairo';font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 30px rgba(232,98,44,.45);transition:.2s}
.hero .cta:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(232,98,44,.55)}
.hero-badges{display:flex;gap:22px;margin-top:30px;flex-wrap:wrap}
.hero-badges div{font-size:13.5px;color:#aebbd6;font-weight:600;display:flex;align-items:center;gap:7px}
.hero-badges b{color:#fff;font-family:'Cairo';font-size:20px;display:block}

/* ===== Form ===== */
.grid{display:grid;gap:18px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.field label .req{color:var(--orange)}
.field input,.field select{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;font-family:'Tajawal';font-size:15px;font-weight:600;background:#fbfbfc;transition:.18s;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px var(--orange-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:500}

/* ===== Choice chips (big selectable cards) ===== */
.choices{display:grid;gap:14px}
.choices.g2{grid-template-columns:1fr 1fr}
.choices.g3{grid-template-columns:1fr 1fr 1fr}
.choice{position:relative;border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;background:#fff;transition:.18s;text-align:center}
.choice:hover{border-color:var(--orange);transform:translateY(-2px)}
.choice.sel{border-color:var(--orange);background:var(--orange-soft)}
.choice.sel:after{content:"\2713";position:absolute;top:10px;left:12px;width:22px;height:22px;background:var(--orange);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900}
.choice .emoji{font-size:30px;display:block;margin-bottom:8px}
.choice b{font-family:'Cairo';font-weight:800;font-size:15.5px;display:block}
.choice small{color:var(--muted);font-size:12.5px;font-weight:600;display:block;margin-top:3px}

/* ===== Toggle conditions ===== */
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cond{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;background:#fff;transition:.16s;font-weight:600;font-size:14.5px}
.cond:hover{border-color:var(--orange)}
.cond.on{border-color:var(--orange);background:var(--orange-soft)}
.cond .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;transition:.16s}
.cond.on .box{background:var(--orange);border-color:var(--orange)}
.cond .ico{font-size:18px;color:var(--orange)}

/* ===== Buttons row ===== */
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn{padding:14px 28px;border-radius:13px;font-family:'Cairo';font-weight:800;font-size:15.5px;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:9px}
.btn.primary{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;box-shadow:0 10px 26px rgba(232,98,44,.4)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(232,98,44,.5)}
.btn.dark{background:var(--navy);color:#fff}
.btn.dark:hover{background:var(--navy-2)}
.btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.line:hover{border-color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ===== Exercise picker ===== */
.muscle-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.mtab{padding:9px 16px;border-radius:30px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted);transition:.16s}
.mtab:hover{border-color:var(--orange);color:var(--orange)}
.mtab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.ex{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;transition:.16s}
.ex .thumb{width:64px;height:64px;border-radius:11px;background:#fff;border:1px solid var(--line);color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;padding:3px}
.ex .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.ex .meta{flex:1;min-width:0}
.ex .meta b{font-family:'Cairo';font-weight:700;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .meta small{color:var(--muted);font-size:12px;font-weight:600}
.ex .picks{display:flex;gap:6px}
.pchip{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;color:var(--muted);transition:.14s}
.pchip.fav.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pchip.no.on{background:#e0584e;border-color:#e0584e;color:#fff}
.pchip:hover{border-color:var(--navy)}

/* ===== Disclaimer ===== */
.disclaimer{display:flex;gap:12px;align-items:flex-start;background:#fff7ee;border:1px solid rgba(217,138,31,.3);border-radius:14px;padding:14px 16px;font-size:13.5px;color:#8a5a13;font-weight:600;margin-top:18px}
.disclaimer .ico{color:var(--warn);font-size:20px;flex:none}

/* ===== Plan output ===== */
.plan-head{background:linear-gradient(160deg,var(--navy),var(--navy-3));color:#fff;border-radius:24px;padding:32px 34px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:22px}
.plan-head:after{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,44,.3),transparent 70%)}
.plan-head .in{position:relative;z-index:2}
.plan-head h2{font-size:28px;margin-bottom:6px}
.plan-head h2 span{color:var(--orange-2)}
.plan-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.plan-meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:7px 14px;border-radius:30px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.day-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.day-top{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff}
.day-top .num{width:42px;height:42px;border-radius:12px;background:var(--orange);display:grid;place-items:center;font-family:'Cairo';font-weight:900;font-size:18px;flex:none}
.day-top b{font-family:'Cairo';font-size:18px;display:block}
.day-top small{color:#b9c5dd;font-weight:600;font-size:12.5px}
.ex-row{display:flex;align-items:center;gap:15px;padding:15px 22px;border-bottom:1px solid var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-row .pic{width:88px;height:88px;border-radius:13px;background:#fff;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--navy);overflow:hidden;text-align:center;font-size:11px;font-weight:700;line-height:1.2;padding:4px}
.ex-row .pic img{max-width:100%;max-height:100%;object-fit:contain}
.ex-row .body{flex:1;min-width:0}
.ex-row .body b{font-family:'Cairo';font-weight:700;font-size:16px}
.ex-row .body .tip{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:3px}
.ex-row .body .tip .i{color:var(--orange)}
.ex-row .sets{display:flex;gap:18px;flex:none;text-align:center}
.ex-row .sets div b{font-family:'Cairo';font-size:19px;display:block;color:var(--navy)}
.ex-row .sets div small{font-size:11px;color:var(--muted);font-weight:700}
.ex-row .vid{flex:none}
.ex-row .vid a{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#ff0000;color:#fff;font-size:20px;text-decoration:none;box-shadow:0 6px 16px rgba(255,0,0,.3);transition:.16s}
.ex-row .vid a:hover{transform:scale(1.07)}
.ex-row .vid .off{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#eef0f4;color:var(--muted);font-size:18px}

/* ===== Image manager ===== */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.img-slot{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fbfbfc;transition:.16s;position:relative}
.img-slot:hover{border-color:var(--orange);background:var(--orange-soft)}
.img-slot.filled{border-style:solid;border-color:var(--ok)}
.img-slot .ph{width:100%;aspect-ratio:1;border-radius:10px;background:#eef0f4;display:grid;place-items:center;color:var(--muted);font-size:26px;margin-bottom:8px;overflow:hidden}
.img-slot .ph img{width:100%;height:100%;object-fit:cover}
.img-slot b{font-size:13px;font-weight:700;font-family:'Cairo'}

/* ===== Misc ===== */
.note{font-size:13px;color:var(--muted);font-weight:600;text-align:center;margin-top:14px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.gender-pills{display:flex;gap:10px}
.gender-pills .gp{flex:1;text-align:center;border:2px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;font-weight:800;font-family:'Cairo';transition:.16s;background:#fff}
.gender-pills .gp.sel{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.summary-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.summary-strip .chip{background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px 15px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(15,31,61,.04)}
.summary-strip .chip i{color:var(--orange)}

/* ===== الغلاف الاحترافي ===== */
.cover{display:none;position:relative;border-radius:24px;overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow-lg);min-height:auto}
.cover.show{display:block}
.cover-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%)}
.cover-bg:after{content:"";position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,44,.4),transparent 70%)}
.cover-bg:before{content:"";position:absolute;left:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,61,.22),transparent 70%)}
.cover-in{position:relative;z-index:2;padding:34px 36px;color:#fff}
.cover-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.cover-brand .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--orange-2));display:grid;place-items:center;font-family:'Cairo';font-weight:900;font-size:22px;box-shadow:0 6px 18px rgba(232,98,44,.5)}
.cover-brand b{font-family:'Cairo';font-weight:900;font-size:22px}
.cover-brand b span{color:var(--orange-2)}
.cover-brand small{display:block;color:#aebbd6;font-size:11px;font-weight:600;margin-top:-3px}
.cover-photo{width:100%;height:auto;min-height:120px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;margin-bottom:22px}
.cover-photo img{width:100%;height:auto;display:block;object-fit:contain}
.cover-photo span{color:#8294b8;text-align:center;font-size:30px;font-weight:700}
.cover-photo em{font-size:13px;font-style:normal;display:block;margin-top:4px}
.cover-eyebrow{display:inline-block;color:var(--orange-2);font-family:'Cairo';font-weight:800;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.cover-title{font-size:34px;font-family:'Cairo';font-weight:900;margin-bottom:20px}
.cover-data{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.cover-data>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:12px;text-align:center}
.cover-data b{font-family:'Cairo';font-weight:900;font-size:18px;display:block}
.cover-data small{color:#aebbd6;font-size:11.5px;font-weight:600}
.cover-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding-top:16px;font-weight:700;font-size:13.5px;color:#c4cfe6}
@media (max-width:760px){.cover-data{grid-template-columns:repeat(2,1fr)}.cover-title{font-size:26px}.cover-photo{height:auto}}

  .hero{padding:34px 24px}.hero h1{font-size:28px}
  .card{padding:22px}
  .ex-row{flex-wrap:wrap}.ex-row .sets{width:100%;justify-content:flex-start;margin-top:6px}
  .topbar-in{padding:14px}
  .plan-head{padding:24px}
}
</style>
</head>

<script>

/* ---------- العضلات الـ14 (مطابقة لملف العميلة) ---------- */
const MUSCLES = {

/* قائمة الصور التي ترفعها العميلة مرة واحدة */
const IMAGE_SLOTS = [

  ["frontdelt","اكتاف امامية"],["reardelt","كتف خلفي"],["sidedelt","كتف علوي"],
  ["biceps","عضلات البايسبس"],["triceps","عضلات التراي سبس"],
  ["absfront","بطن"],["absside","بطن جانبي"],
  ["quads","فخذ أمامي"],["adductors","فخذ داخلي"],["hamstrings","فخذ خلفي"],
  ["glutes","المؤخرة"],["calves","السمانة"]
];

/* ---------- مجموعات العضلات للعرض في منتقي التمارين ---------- */
const MGROUPS = [
  ["chest","الصدر","🫀"],
  ["back","الظهر","🔙"],
  ["shoulders","الأكتاف","💪"],
  ["biceps","البايسبس","💪"],
  ["triceps","الترايسبس","💪"],
  ["quads","فخذ أمامي","🦵"],
  ["hams","فخذ خلفي","🦵"],
  ["adductors","فخذ داخلي","🦵"],
  ["calves","سمانة","🦵"],
  ["glutes","المؤخرة","🍑"],
  ["abs","البطن","🔥"]
];

/* ============================================================
   قاعدة بيانات التمارين
   env: gym | home | bodyweight
   group: مجموعة العرض | muscle: العضلة المستهدفة (للصورة)

function loadParams(){

}

const MIN_WEEKLY_SETS = { big:10, small:8 };
function minSetsFor(group){ return BIG_GROUPS.includes(group) ? MIN_WEEKLY_SETS.big : MIN_WEEKLY_SETS.small; }

/* عدد التمارين المستهدف لكل عضلة في اليوم، حسب الحجم والمستوى */
function exCountFor(group, level){
  const big = BIG_GROUPS.includes(group);
  if(level===1) return big ? 3 : 2;   // مبتدئ
  if(level===2) return big ? 3 : 2;   // متوسط
  return big ? 4 : 2;                  // متقدم
}

      {h:"ممنوع تكرار نفس العضلة يومين متتاليين", p:"كل عضلة تُمرَّن بجهد عالٍ تحتاج 48 ساعة على الأقل لترتاح وتُبنى من جديد. يمكنك تمرين الجزء العلوي اليوم والسفلي غداً، لكن لا تمرّني الصدر مثلاً في يومين متتاليين."},
      {h:"التوقعات الواقعية", p:"النتائج الحقيقية تظهر خلال 8–12 أسبوعاً من الالتزام، لا خلال أيام. الصبر والثبات على الجدول أهم من شدّة الحماس في الأسبوع الأول."}
    ]},
  { title:"كيف تعمل التمارين؟",
    intro:"يُقسم الجسم إلى عضلات كبيرة وصغيرة، ولكل عضلة احتياجها من حجم التمرين الأسبوعي (عدد الجلسات). فهم هذا يساعدك على توزيع جهدك بذكاء.",
    blocks:[
      {h:"العضلات الصغيرة", p:"مثل البايسبس والترايسبس والأكتاف والبطن والسمانة. تحتاج 4 جلسات أسبوعياً كحد أدنى (تمرين واحد بـ4 جلسات). للاستفادة الأكبر: 8–12 جلسة، أي 2–3 تمارين."},
      {h:"العضلات الكبيرة", p:"مثل الصدر والظهر والأرجل والمؤخرة. تحتاج 8 جلسات أسبوعياً كحد أدنى (تمرينان بـ4 جلسات لكلٍ منهما). للاستفادة الأكبر: 12–15 جلسة، أي 3–4 تمارين."},
      {h:"كيف تنمو العضلة؟", p:"النمو يحدث عبر ثلاثة محفّزات: التوتر الميكانيكي (رفع أوزان تتحدّاك)، التلف العضلي (الإجهاد الذي يُصلَح أقوى)، والإجهاد الأيضي (الحرقان من التكرارات العالية). جدولك مصمَّم ليجمعها."},
      {h:"الهدف", p:"يُنصح بأداء 12–15 جلسة للعضلة أسبوعياً للحصول على أفضل نتيجة. المهم أن تفهمي المبدأ لا أن تحفظي الأرقام فقط، لتقدري على تعديل تمرينك بنفسك مع الوقت."}
    ]},
  { title:"كم الوزن الذي نبدأ به؟",
    intro:"اختيار الوزن الصحيح فنّ مهم: ثقيل جداً يكسر التكنيك ويسبّب الإصابة، وخفيف جداً لا يحفّز النمو. الهدف وزن يتحدّاك مع حفاظك على الأداء السليم.",
    blocks:[
      {h:"البداية الآمنة", p:"في البداية لا نرفع أوزاناً ثقيلة. ابدئي بوزن 2–3 كيلو في أغلب التمارين، وبعض التمارين (كالأرجل) تتحملين فيها أكثر. ركّزي أول أسبوعين على إتقان الحركة قبل زيادة الوزن."},
      {h:"نطاق التكرارات", p:"الحد الأدنى 8 تكرارات لكل جولة، والحد الأقصى 12 تكراراً. الوزن المناسب هو الذي يجعل آخر تكرارين صعبين لكن بتكنيك سليم."},
      {h:"متى تزيدين الوزن؟", p:"إذا وصلتِ في كل الجولات للحد الأقصى (12 تكراراً) بسهولة، فالمرة القادمة ارفعي الوزن قليلاً (نصف إلى واحد كيلو). الهدف الاقتراب من الفشل العضلي في آخر مجموعة."},
      {h:"بديل زيادة الوزن", p:"إذا كان الوزن الأعلى ثقيلاً عليك، يمكنك زيادة عدد التكرارات أو إبطاء النزول حتى الوصول للتحدّي المطلوب، ثم تنتقلين للوزن الأعلى لاحقاً."},
      {h:"ما الفشل العضلي؟", p:"هو النقطة التي لا تقدرين فيها على تكرار إضافي بتكنيك سليم. لا يعني الإصابة، بل أنك استنفدتِ العضلة. للمبتدئة يكفي الاقتراب منه دون الوصول التام إليه."}
    ]},
  { title:"التكنيك الصحيح — كيف أعرف أني صح؟",
    intro:"أداء التمرين بشكل صحيح هو أساس النتيجة والسلامة. تمرين واحد بتكنيك سليم أفضل من عشرة بأداء خاطئ، لأن الخطأ يبني عادة سيئة ويعرّضك للإصابة.",
    blocks:[
      {h:"الشعور بالعضلة المستهدفة", p:"عند الأداء الصحيح ستشعرين بتقلّصات في العضلة المستهدفة؛ غياب الإحساس قد يعني خطأً في الأداء أو وزناً ثقيلاً يجبر عضلات أخرى على المساعدة."},
      {h:"الحركة السلسة والمتحكَّمة", p:"يجب أن تكون الحركة سلسة دون اهتزاز أو تأرجح؛ الاهتزاز يعني وزناً ثقيلاً أو استخدام الزخم بدل العضلة. تحكّمي في الوزن صعوداً ونزولاً."},
      {h:"وضعية الجسم الصحيحة", p:"حافظي على استقامة الظهر وشدّ البطن، وتجنّبي تقويس أسفل الظهر، وثبّتي قدميك مع توزيع الوزن بالتساوي. الوضعية الصحيحة تحمي مفاصلك."},
      {h:"المدى الكامل للحركة", p:"أدّي الحركة بمداها الكامل (نزول كامل وانقباض كامل) ما لم يمنعك ألم. المدى الكامل يبني عضلة أقوى وأكثر مرونة من الحركات النصفية."},
      {h:"صوّري نفسك", p:"إن لم تتأكدي من تكنيكك، صوّري نفسك من الجانب وقارني بالفيديو المرجعي. العين الخارجية تكشف أخطاءً لا تشعرين بها أثناء الأداء."}
    ]},
  { title:"التنفس الصحيح أثناء التمارين",
    intro:"التنفس الصحيح من أهم عوامل التمرين الفعّال والآمن، وكثيرات يهملنه فيفقدن قوة وثباتاً دون أن يدرين.",
    blocks:[
      {h:"الفائدة", p:"التنفس العميق يوصل الأكسجين للعضلات، يحسّن التحمّل، يثبّت الجذع، ويقلّل التعب وخطر الإصابات والدوخة."},
      {h:"القاعدة الذهبية", p:"الزفير مع المجهود/الانقباض (مرحلة الرفع)، والشهيق مع النزول/الانبساط. مثلاً في السكوات: شهيق وأنتِ تنزلين، زفير وأنتِ تصعدين."},
      {h:"تجنّبي كتم النفس", p:"كتم النفس أثناء الجهد يرفع ضغط الدم فجأة ويسبّب الدوخة. الاستثناء الوحيد رفعات ثقيلة جداً متقدمة، وهذا خارج نطاق المبتدئة."},
      {h:"الإيقاع", p:"اجعلي تنفسك منتظماً مع إيقاع الحركة، لا متسرّعاً ولا محبوساً. التنفس الهادئ المنتظم علامة على تحكّمك في الوزن."}
    ]},
  { title:"نطاقات التكرارات حسب الهدف",
    intro:"عدد التكرارات ليس عشوائياً؛ كل نطاق يحفّز الجسم بطريقة مختلفة. معرفتك بهذا تتيح لك تفصيل تمرينك حسب هدفك.",
    blocks:[
      {h:"تكرارات منخفضة (1–5)", p:"تركّز على القوة القصوى وتدريب الجهاز العصبي على تجنيد أكبر عدد من الألياف. مناسبة للمتقدمات، وتحتاج أوزاناً ثقيلة وراحة أطول بين الجولات."},
      {h:"تكرارات متوسطة (6–12)", p:"النطاق الذهبي للتضخيم وشدّ العضلات؛ يجمع بين التوتر الميكانيكي والإجهاد الأيضي بتوازن. الأنسب لأغلب أهداف التشكيل والقوام."},
      {h:"تكرارات عالية (15+)", p:"تركّز على التحمّل العضلي وزيادة ضخ الدم وكفاءة الأكسجين. مفيدة للسمانة والبطن وللإحماء وللمبتدئات في إتقان الحركة."},
      {h:"الأهم من النطاق", p:"بغضّ النظر عن النطاق، النمو يتطلب الاقتراب من الفشل العضلي. 15 تكراراً سهلة لا تبني، بينما 8 تكرارات متحدّية تبني. التحدّي هو المفتاح."}
    ]},
  { title:"سرعة الحركة (Tempo)",
    intro:"رتم الحركة يتكوّن من مراحل، والتحكم فيه يضاعف نتيجة نفس التمرين دون زيادة الوزن. سلاح خفيّ تجهله كثيرات.",
    blocks:[
      {h:"مرحلة الانبساط (النزول)", p:"أهم مرحلة للبناء العضلي. اجعليها بطيئة ومتحكّمة (2–3 ثوانٍ) لزيادة وقت التوتر على العضلة. مقاومة النزول أقوى محفّز للنمو يُهمله المبتدئون."},
      {h:"مرحلة الانقباض (الرفع)", p:"يُفضَّل أن تكون مسيطَراً عليها وبقوة، لتفعيل أكبر قدر من الألياف. ليست متسرّعة بالزخم، بل قوية بتحكّم."},
      {h:"لحظة الانقباض (العصر)", p:"اعصري العضلة لحظة في قمة الحركة (مثلاً أعلى تمرين البايسبس). هذه اللحظة تزيد تفعيل العضلة وتحسّن الاتصال الذهني العضلي."},
      {h:"الثبات في الأسفل", p:"الثبات لحظة في أسفل الحركة يقلّل الزخم ويجبر العضلة على حمل الوزن بالكامل دون استعانة بالاندفاع، فتشتغل العضلة لا الحركة."}
    ]},
  { title:"الزيادة التدريجية — مفتاح كل تطور",
    intro:"أن تطلبي من جسمك مجهوداً أكبر تدريجياً مع الوقت. هذا المبدأ هو السبب الأول للنتائج، وغيابه السبب الأول للثبات.",
    blocks:[
      {h:"لماذا ضرورية؟", p:"الجسم يتكيّف مع أي ضغط يتكرّر. لو بقيتِ على نفس الوزن والتكرار شهوراً، يتوقف النمو لأن جسمك اعتاد. الزيادة التدريجية تعطيه تحدّياً جديداً باستمرار."},
      {h:"طرق التطبيق", p:"زيادة الأوزان، أو زيادة التكرارات، أو زيادة عدد الجولات، أو إبطاء التمبو، أو تقليل الراحة بين الجولات، أو تحسين المدى والتكنيك. لا تقتصري على الوزن فقط."},
      {h:"متى تزيدين؟ (اختبار RPE)", p:"إذا أنهيتِ تكراراتك وأحسستِ أنك تقدرين على 3–4 إضافية بسهولة، فالوزن صار خفيفاً وحان وقت الزيادة. اهدفي لإنهاء كل مجموعة وأنتِ تشعرين بتحدٍّ حقيقي."},
      {h:"التدرّج لا القفز", p:"زيدي بخطوات صغيرة (نصف كيلو أو تكرار واحد). القفزات الكبيرة المفاجئة تكسر التكنيك وتسبّب الإصابة وتراجعاً يضيّع تقدّمك."}
    ]},
  { title:"الألم بعد التمرين (DOMS)",
    intro:"الألم بعد التمرين ليس مقياساً لجودة التمرين، وهذه معلومة يخطئ فيها الكثيرون فيطاردون الألم بدل النتيجة.",
    blocks:[
      {h:"ما هو؟", p:"تمزّقات مجهرية بسيطة في الألياف العضلية، تظهر بعد 24–48 ساعة، وتحدث غالباً عند تغيير الجدول أو زيادة الأوزان أو العودة بعد انقطاع."},
      {h:"لماذا ليس مقياساً؟", p:"الجسم يتكيّف مع الوقت؛ غياب الألم قد يعني أن استشفاءك جيد وتغذيتك ونومك ممتازان، لا أن التمرين بلا فائدة. كثير من تمارينك الفعّالة لن تسبّب ألماً."},
      {h:"كيف تخففينه؟", p:"الحركة الخفيفة والمشي، الترطيب الجيد، النوم الكافي، والبروتين تساعد على التعافي. الراحة التامة قد تطيل الألم بدل تقصيره."},
      {h:"متى يكون مقلقاً؟", p:"ألم العضلة الطبيعي يتحسّن خلال أيام. أما الألم الحادّ في المفصل أو الألم المفاجئ أثناء الحركة فإشارة توقّف ومراجعة، وليس DOMS."}
    ]},
  { title:"الإحساس بالعضلة",
    intro:"الإحساس بالعضلة (الاتصال الذهني العضلي) شيء جيد ومفيد لكنه ليس شرطاً وحيداً للنمو، ولا يجب أن يكون هاجسك الوحيد.",
    blocks:[
      {h:"في التمارين المركبة", p:"كالسكوات والرفعة الميتة يصعب الإحساس بعضلة بعينها لأن الجسم يعمل كمنظومة. التركيز المفرط على الإحساس فيها قد يجبرك على أوزان خفيفة تقلّل الفائدة."},
      {h:"في التمارين العازلة", p:"كمرجحة البايسبس وتفتيح الصدر، الإحساس بالعضلة مفيد جداً ويحسّن التفعيل. اعصري وركّزي ذهنك على العضلة العاملة."},
      {h:"المقياس الحقيقي", p:"هل أوزانك تزيد مع الوقت؟ هل تكنيكك تحسّن؟ هل شكلك وقوتك في تطوّر؟ هذا هو الدليل الحقيقي على التقدّم، لا مجرّد الحرقان أو غيابه."}
    ]},
  { title:"النوم والاستشفاء — نصف النتيجة",
    intro:"كثيرات يركّزن على التمرين ويهملن أهم عاملين خارج الصالة: النوم والتعافي. هنا تُبنى العضلة فعلياً.",
    blocks:[
      {h:"دور النوم", p:"أثناء النوم العميق يفرز الجسم هرمونات البناء ويصلح الألياف. النوم أقل من 6 ساعات يقلّل النتائج، يزيد الجوع، ويرفع هرمون التوتر الذي يعيق التقدّم."},
      {h:"كم تحتاجين؟", p:"7–9 ساعات نوم متواصل ليلاً. جودة النوم لا تقل أهمية عن عدد ساعاته؛ غرفة مظلمة وهادئة وبعيدة عن الشاشات قبل النوم تصنع فرقاً."},
      {h:"الراحة بين التمارين", p:"خذي يوم راحة أو يومين أسبوعياً. أيام الراحة ليست كسلاً بل جزء من البرنامج؛ فيها يكتمل البناء وتعودين أقوى."},
      {h:"علامات الإفراط", p:"تعب مستمر، تراجع الأداء، قلة النوم، فقدان الحماس، أو ألم لا يزول — كلها إشارات أنك تحتاجين راحة أكثر، لا تمريناً أكثر."}
    ]},
  { title:"أخطاء شائعة تجنّبيها",
    intro:"تجنّب الأخطاء أحياناً أهم من إضافة تمارين. هذه أكثر الأخطاء التي تعيق نتائج المبتدئات وحتى المتوسطات.",
    blocks:[
      {h:"مطاردة الألم والتعب", p:"الهدف هو التحفيز لا الإنهاك. تمرين ذكي بأوزان متدرّجة أفضل من تمرين يتركك محطّمة يومين. التعب الشديد ليس دليل نجاح."},
      {h:"إهمال التكنيك للوزن", p:"رفع وزن ثقيل بتكنيك سيّئ يبني عادة خاطئة ويعرّضك للإصابة. الوزن المناسب مع أداء سليم دائماً أفضل."},
      {h:"عدم الاستمرارية", p:"التنقّل بين الجداول كل أسبوع أو الانقطاع المتكرّر يمنع الجسم من التكيّف. الثبات على برنامج لأسابيع هو ما يصنع النتيجة."},
      {h:"إهمال الإحماء", p:"البدء بأوزان ثقيلة دون إحماء يزيد خطر الإصابة ويقلّل الأداء. دقائق الإحماء استثمار لا إضاعة وقت."},
      {h:"المقارنة بالآخرين", p:"كل جسم يستجيب بسرعته الخاصة. قارني نفسك بنفسك قبل أسابيع، لا بمن في الصالة أو على الإنترنت."}
    ]},
  { title:"الثبات (Plateau) وكيف تكسرينه",
    intro:"الثبات مرحلة طبيعية يصل لها الجميع: تتمرّنين بانتظام لكن النتائج توقفت. فهم أسبابه يساعدك على تجاوزه.",
    blocks:[
      {h:"ما هو الثبات؟", p:"نقطة يتوقف فيها التقدّم رغم انتظامك. سببها أن جسمك تكيّف مع التحدّي الحالي ولم يعد يجد سبباً للتغيّر."},
      {h:"غيّري المتغيّرات", p:"بدّلي ترتيب التمارين، أو زيدي الأوزان/التكرارات، أو غيّري التمبو، أو قلّلي الراحة. أي تحدٍّ جديد يوقظ التكيّف من جديد."},
      {h:"راجعي الأساسيات", p:"الثبات أحياناً ليس في التمرين، بل في قلة النوم أو التغذية أو التوتر. راجعي حياتك خارج الصالة أولاً."},
      {h:"خذي أسبوع تخفيف", p:"أحياناً جسمك متعب متراكم. أسبوع بأوزان أخف (Deload) يتيح تعافياً كاملاً، وتعودين بعده أقوى وتكسرين الثبات."}
    ]},
  { title:"الكارديو وحرق الدهون",
    intro:"الكارديو مكمّل مفيد للصحة والقلب وحرق السعرات، لكن دوره وحدوده يُفهَمان خطأً كثيراً.",
    blocks:[
      {h:"الكارديو وحده لا ينحت", p:"حرق الدهون يعتمد أساساً على عجز السعرات (تأكلين أقل مما تحرقين). الكارديو يساعد، لكن تمارين المقاومة والتغذية هي الأساس في تشكيل القوام."},
      {h:"التوقيت", p:"يُفضَّل الكارديو بعد تمارين المقاومة أو في يوم منفصل، حتى لا يستهلك طاقتك قبل رفع الأوزان. الأوزان أولاً للحفاظ على العضلة."},

/* ---------- أدوات الجنس في الخطاب ---------- */
/* ============================================================
   الصياغة حسب جنس العميل
   النصوص الموجّهة للعميل مكتوبة بصيغة المؤنث لأن أغلب المشتركات إناث.
   عند اختيار «ذكر» تُحوَّل آلياً. القاموس صريح لا اشتقاقي، لأن حذف
   الياء الأخيرة يفسد كلمات مثل «كرسي» و«لوحي» و«الخلفي».
   ============================================================ */
const GT_VERBS = {
  "أبقي":"أبقِ","أمسكي":"أمسك","أنزلي":"أنزل","اثني":"اثنِ","اجمعي":"اجمع","اخطي":"اخطُ",

  "ضمّي":"ضمّ","قاومي":"قاوم","قرّبي":"قرّب","لُفّي":"لُفّ","مدّي":"مدّ","وازني":"وازن",
  "استرخي":"استرخِ","دعي":"دع","الصقي":"ألصق","افردي":"افرد","تحكّمي":"تحكّم","وجّهي":"وجّه",
  "ضعي":"ضع","اجلسي":"اجلس","قفي":"قف","خذي":"خذ","تنفّسي":"تنفّس","أدّي":"أدِّ","ميلي":"مِل",
  "ابدئي":"ابدأ","كرّري":"كرّر","حاولي":"حاول","اتركي":"اترك","احرصي":"احرص","تجنّبي":"تجنّب",
  "اختاري":"اختر","سجّلي":"سجّل","زيدي":"زد","قلّلي":"قلّل","توقّفي":"توقّف","استشيري":"استشر",
  "نامي":"نم","اشربي":"اشرب","تمرّني":"تمرّن","التزمي":"التزم","ركّزي":"ركّز","انتبهي":"انتبه"
};
const GT_WORDS = {
  "مستلقية":"مستلقياً","جالسة":"جالساً","واقفة":"واقفاً","منبطحة":"منبطحاً","ممدودة":"ممدودة",
  "تشعرين":"تشعر","تقدرين":"تقدر","تزيدين":"تزيد","تحتاجين":"تحتاج","ترسمين":"ترسم",
  "تتوقفين":"تتوقف","تهدمين":"تهدم","تتحملين":"تتحمل","ستشعرين":"ستشعر","تلاحظين":"تلاحظ",
  "تستطيعين":"تستطيع","تبدئين":"تبدأ","أنتِ":"أنت","نفسكِ":"نفسك","جسمكِ":"جسمك",
  /* صيغ النهي: «لا تتأرجحي» → «لا تتأرجح» */
  "تتأرجحي":"تتأرجح","تتحركي":"تتحرك","تندفعي":"تندفع","تتركي":"تترك","تعتمدي":"تعتمد",
  "تقتصري":"تقتصر","تكفي":"تكفِ","تبني":"تبنِ","تنسي":"تنسَ","تستعجلي":"تستعجل",
  "تفرطي":"تفرط","تحبسي":"تحبس","تميلي":"تمل","تقفلي":"تقفل","تهملي":"تهمل","تقارني":"تقارن"
};
/* يُبنى مرة واحدة: تعبير واحد لكل الكلمات مع حدود عربية سليمة */
let __gtRe = null;
function gtRegex(){
  if(__gtRe) return __gtRe;
  const keys = Object.keys(GT_VERBS).concat(Object.keys(GT_WORDS))
    .sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  /* نسمح بواو أو فاء ملتصقة قبل الفعل («واعصري» و«فارفعي») ونعيدها كما هي،
     وإلا فاتت أكثر من نصف الحالات. */
  /* البنية: [واو/فاء ملتصقة] + الفعل + [ضمير ملتصق]
     «واسحبيه» = و + اسحبي + ه ← «واسحبه». بدون الضمير تفوت حالات كثيرة. */
  __gtRe = new RegExp("(^|[^\\u0621-\\u064A])([وف]?)(" + keys.join("|") +
                      ")(ها|هما|هم|هن|ه)?(?![\\u0621-\\u064A])","g");
  return __gtRe;
}
/* gt = gender text — تُطبَّق على كل نص موجّه للعميل */
function gt(txt){
  if(!txt || S.client.gender !== "male") return txt;
  return String(txt).replace(gtRegex(), (m,pre,conj,w,suf)=> pre + conj + (GT_VERBS[w] || GT_WORDS[w] || w) + (suf||""));
}

function g(male, female){ return S.client.gender==="male" ? male : female; }

/* ============================================================
   مزامنة الصور بين الأجهزة
   المشكلة: localStorage مخزن خاص بكل متصفح على كل جهاز، فالصور
   المرفوعة على اللابتوب لا تظهر على الجوال ولو كان الملف منشوراً.
   الحل: صور موضوعة كملفات بجانب البرنامج على الخادم — يراها كل جهاز.
   المرفوع محلياً يبقى له الأولوية حتى لا يضيع عمل سابق.
   ============================================================ */
const BUILTIN_THUMBS = {};
const IMG_BASE = "img/";                       // مجلد بجانب index.html
const IMG_EXTS = [".png",".jpg",".jpeg",".webp"];
let remoteImages = {};

function probeRemoteImages(){
  /* يعمل محلياً أيضاً: وسم <img> يقرأ المسارات النسبية من file:// بلا مشكلة
     (المنع يخص fetch وXHR فقط). فيكفي أن يكون مجلد img بجانب الملف لتجربته
     قبل النشر. الحرس السابق كان يوقف الفحص محلياً بلا داعٍ. */
  const keys = [...IMAGE_SLOTS.map(s=>s[0]), "logo", "logo-white", "cover"];
  keys.forEach(k=>{
    let i = 0;
    const tryNext = () => {
      if(i >= IMG_EXTS.length) return;
      const url = IMG_BASE + k + IMG_EXTS[i++];
      const im = new Image();
      im.onload  = () => { remoteImages[k] = url; render(); };
      im.onerror = tryNext;
      im.src = url;
    };
    tryNext();
  });
}
/* مصدر الصورة: المرفوع محلياً ← ثم صورة الخادم ← ثم لا شيء */
function imgSrc(key){ return S.images[key] || remoteImages[key] || null; }

function imgPic(muscle){
  const src = imgSrc(muscle);
  return src ? `<img src="${src}">` : (MUSCLES[muscle]||"عضلة");
}

/* ============================================================
   توليد الجدول
   ============================================================ */
function dangerSet(){
  const d=new Set();
  S.conditions.forEach(cid=>{
    const c=CONDITIONS.find(x=>x.id===cid);
    if(c) c.avoid.forEach(r=>d.add(r));
  });
  return d;
}
function generate(){
  const danger=dangerSet();
  const sys = SPLIT_SYSTEMS[S.split] || SPLIT_SYSTEMS.ppl;
  const split = sys.days[S.days] || sys.days[4] || Object.values(sys.days)[0];
  const L=loadParams();
  const used=new Set();

  const plan = split.map((groups, dayIdx)=>{
    const dayPicks=[];
    const totalTarget = S.dailyCount;

    // العضلات المركّز عليها (إن وُجد تركيز)
    const focusMuscles = (FOCUS[S.focus]?.muscles)||[];
    const isFocus = g => focusMuscles.includes(g);

    // توزيع الحصص: لكل عضلة حد أدنى يضمن عدم إهمالها
    // الكبيرة: تمرينان — الصغيرة: تمرين — والمركّز عليها تحصل على +2 إضافي
    const minQuota = groups.map(g=>{
      let q = BIG_GROUPS.includes(g)?2:1;
      if(isFocus(g)) q += 2;   // التركيز يرفع الحد الأدنى للعضلة المختارة بقوة
      return q;
    });
    const minSum = minQuota.reduce((a,b)=>a+b,0);

    // العدد المستهدف = اختيار المدربة بالضبط (يلتزم في كل يوم)
    // الحد الأدنى للجلسات يتحقق عبر تكرار العضلة على أيام الأسبوع، لا بزيادة تمارين اليوم
    const effectiveTarget = totalTarget;

    // الوزن في توزيع الفائض: الكبيرة 2، الصغيرة 1، والمركّز عليها تُضاعف بقوة
    const weights = groups.map(g=>{
      let w = BIG_GROUPS.includes(g)?2:1;
      if(isFocus(g)) w += 3;   // أولوية أعلى للفائض لصالح منطقة التركيز
      return w;
    });
    const wSum = weights.reduce((a,b)=>a+b,0);
    // نبدأ بالحد الأدنى لكل عضلة، ثم نوزّع الفائض حسب الوزن
    let quotas = [...minQuota];
    let extra = effectiveTarget - minSum;
    if(extra >= 0){
      // العدد يكفي أو يزيد: نوزّع الفائض على الأعلى وزناً
      while(extra>0){
        let idx=0, best=-1;
        for(let i=0;i<groups.length;i++){
          const score = weights[i]*10 - quotas[i];
          if(score>best){ best=score; idx=i; }
        }
        quotas[idx]++; extra--;
      }
    } else {
      // العدد أقل من مجموع الحد الأدنى: نبدأ من الصفر ونوزّع العدد المحدد
      // بأولوية للعضلات الأعلى وزناً (الكبيرة والمركّز عليها أولاً)
      quotas = groups.map(()=>0);
      let remaining = effectiveTarget;
      // جولة أولى: كل عضلة تمرين واحد (حسب الأولوية) طالما يوجد عدد
      const order = groups.map((g,i)=>i).sort((a,b)=>weights[b]-weights[a]);
      for(const i of order){ if(remaining<=0) break; quotas[i]=1; remaining--; }
      // الباقي: للأعلى وزناً
      while(remaining>0){
        let idx=order[0];
        for(const i of order){ if(quotas[i]<quotas[idx]+1){ idx=i; break; } }
        // نعطي الأعلى وزناً الأقل حصة
        let best=-1;
        for(const i of order){ const s=weights[i]*10-quotas[i]; if(s>best){best=s;idx=i;} }
        quotas[idx]++; remaining--;
      }
    }

    // نجمع تمارين كل عضلة مرتّبة علمياً: المركّب أولاً ثم العزل
    groups.forEach((group,gi)=>{
      const target = quotas[gi];
      let pool = EX.filter(e=>
        e.group===group &&
        e.env.includes(S.env) &&
        e.level<=S.level &&
        !S.no.has(e.id) &&
        !e.risk.some(r=>danger.has(r))
      );
      // تصنيف نوع المعدة لكل تمرين
      const isBand = e => e.id.startsWith("band") || e.name.includes("شريط") || e.name.includes("باند");
      const isMachine = e => e.name.includes("جهاز") || e.name.includes("كيبل") || e.name.includes("ماكينة") || e.name.includes("سميث");
      // رتبة المعدة حسب البيئة (الأقل = الأولوية الأعلى)
      const equipRank = e => {
        if(S.env==="gym"){
          // النادي: الأجهزة أولاً، ثم الأثقال الحرة، ثم الباند
          if(isBand(e)) return 2;
          if(isMachine(e)) return 0;
          return 1;                 // أثقال حرة (دمبل/بار/وزن جسم)
        }
        if(S.env==="home"){
          // البيت: الأثقال أولاً، الباند أخيراً
          return isBand(e) ? 2 : 0;
        }
        return 0;                   // وزن الجسم: الكل متساوٍ
      };

      // الترتيب: (1) المفضّل (2) المعدة حسب البيئة (3) مركّب قبل عزل (4) تنويع
      pool.sort((a,b)=>{
        const fa=S.fav.has(a.id)?0:1, fb=S.fav.has(b.id)?0:1;
        if(fa!==fb) return fa-fb;                               // المفضّل أولاً
        const ra=equipRank(a), rb=equipRank(b);
        if(ra!==rb) return ra-rb;                              // أولوية المعدة
        const ca=a.type==="compound"?0:1, cb=b.type==="compound"?0:1;
        if(ca!==cb) return ca-cb;                               // مركّب قبل عزل
        const ua=used.has(a.id)?1:0, ub=used.has(b.id)?1:0;
        return ua-ub;                                           // تنويع
      });

      const groupPicks=[];
      let added=0;
      // المرحلة 1: تمارين غير مستخدمة هذا الأسبوع (تنويع)
      for(const e of pool){
        if(added>=target) break;
        if(used.has(e.id)) continue;
        groupPicks.push(e); used.add(e.id); added++;
      }
      // المرحلة 2: عند نقص الخيارات، نسمح بإعادة الاستخدام
      if(added<target){
        for(const e of pool){
          if(added>=target) break;
          if(groupPicks.includes(e)) continue;
          groupPicks.push(e); added++;
        }
      }
      // ضمان الترتيب العلمي داخل العضلة: المركّب قبل العزل
      groupPicks.sort((a,b)=>(a.type==="compound"?0:1)-(b.type==="compound"?0:1));
      dayPicks.push(...groupPicks);
    });

    // ترتيب اليوم كاملاً علمياً:
    // 1) العضلات الكبيرة قبل الصغيرة (الأساسي قبل المساعد)
    // 2) داخل كل عضلة: المركّب قبل العزل (محفوظ من فوق)
    // هذا يضمن عدم إرهاق العضلة المساعدة قبل الأساسية (بايسبس بعد الظهر، ترايسبس بعد الصدر)
    const groupOrder = {};
    groups.forEach((g,i)=> groupOrder[g] = (BIG_GROUPS.includes(g)?0:100) + i);
    dayPicks.sort((a,b)=>{
      const go = (groupOrder[a.group]??50) - (groupOrder[b.group]??50);
      if(go!==0) return go;
      return (a.type==="compound"?0:1)-(b.type==="compound"?0:1);
    });

    // حماية أخيرة: لا يوم فارغ
    if(dayPicks.length===0){
      const fb=EX.filter(e=>
        e.env.includes(S.env) && e.level<=S.level &&
        !S.no.has(e.id) && !e.risk.some(r=>danger.has(r))
      ).slice(0,4);
      fb.forEach(e=>{dayPicks.push(e);used.add(e.id);});
    }

    const title = groups.map(gp=>DAY_NAMES[gp]).join(" + ");
    return {title, groups, exercises:dayPicks.map(e=>({...e, video:videoLinks[e.id]||""}))};
  });

  // ===== طبقة التغطية الشاملة =====
  // تضمن ظهور كل عضلة مرة على الأقل (أولوية عليا)، ضمن سقف العدد+1
  ensureFullCoverage(plan, danger, used);

  // ===== طبقة الحد الأدنى للجلسات =====
  // معطّلة افتراضياً لاحترام العدد الذي تحدده المدربة.
  // العدد المحدد له الأولوية القصوى؛ الحد الأدنى للجلسات يتحقق طبيعياً عبر
  // تكرار العضلة على أيام الأسبوع، لا بإضافة تمارين تكسر عدد اليوم.
  // ensureMinimumVolume(plan, danger, used);

  S.plan=plan;
  S.weekly = computeWeeklyVolume(plan);
  go(3);
}

/* تضمن الحد الأدنى للجلسات الأسبوعية: كبيرة ≥10، صغيرة ≥8.
   الجلسات = عدد تمارين العضلة أسبوعياً × المجموعات لكل تمرين.
   تضيف تمارين للعضلات الناقصة في الأيام التي تظهر فيها. */
function ensureMinimumVolume(plan, danger, used){
  const L=loadParams();
  const setsPer = parseInt(L.sets,10)||3;

  // نحسب عدد تمارين كل عضلة أسبوعياً
  const exCount = () => {
    const c={};
    plan.forEach(d=>d.exercises.forEach(e=>{ c[e.group]=(c[e.group]||0)+1; }));
    return c;
  };

  COVERAGE_MUSCLES.forEach(muscle=>{
    let needSets = minSetsFor(muscle);
    // إذا كانت العضلة ضمن منطقة التركيز، نرفع حدها الأدنى الأسبوعي بقوة
    // (هذا يضمن أن التركيز يعمل في كل الأنظمة: علوي/سفلي، PPL، فل بدي)
    const focusMuscles = (FOCUS[S.focus]?.muscles)||[];
    if(focusMuscles.includes(muscle)){
      needSets = BIG_GROUPS.includes(muscle) ? 18 : 14; // حجم مرتفع للمنطقة المستهدفة
    }
    // عدد التمارين المطلوب = تقريب لأعلى (الحد الأدنى ÷ المجموعات)
    const needExercises = Math.ceil(needSets / setsPer);

    let guard=0;
    while((exCount()[muscle]||0) < needExercises && guard<10){
      guard++;
      // نبحث عن تمرين متاح لم يُستخدم بعد
      const pool=EX.filter(e=>
        e.group===muscle &&
        e.env.includes(S.env) &&
        e.level<=S.level &&
        !S.no.has(e.id) &&
        !e.risk.some(r=>danger.has(r))
      );
      if(!pool.length) break; // لا يوجد تمرين متاح — نحترم الاستبعاد ولا نكسره

      // ترتيب الاختيار: المفضّل، ثم المعدة حسب البيئة، ثم مركّب، ثم غير مستخدم
      const isBand = e => e.id.startsWith("band")||e.name.includes("شريط")||e.name.includes("باند");
      const isMachine = e => e.name.includes("جهاز")||e.name.includes("كيبل")||e.name.includes("ماكينة")||e.name.includes("سميث");
      const equipRank = e => {
        if(S.env==="gym") return isBand(e)?2:isMachine(e)?0:1;
        if(S.env==="home") return isBand(e)?2:0;
        return 0;
      };
      pool.sort((a,b)=>{
        const fa=S.fav.has(a.id)?0:1, fb=S.fav.has(b.id)?0:1;
        if(fa!==fb) return fa-fb;
        const ra=equipRank(a), rb=equipRank(b);
        if(ra!==rb) return ra-rb;
        const ua=used.has(a.id)?1:0, ub=used.has(b.id)?1:0;
        if(ua!==ub) return ua-ub;
        return (a.type==="compound"?0:1)-(b.type==="compound"?0:1);
      });
      const pick = pool.find(e=>!used.has(e.id));
      if(!pick) break; // كل التمارين المتاحة مستخدمة بالفعل — لا نكرّر

      // نضيفه لأنسب يوم يحتوي العضلة ولم يتجاوز (العدد المحدد + 1 كحد أقصى)
      // مسموح تجاوز العدد بتمرين واحد فقط لضمان التغطية دون تضخّم اليوم
      const dayCap = S.dailyCount + 1;
      const dayScores=plan.map((d,idx)=>{
        const hasMuscle=d.exercises.some(e=>e.group===muscle)?0:1;
        return {idx, hasMuscle, count:d.exercises.length};
      })
      .filter(x=> plan[x.idx].exercises.length < dayCap)  // فقط الأيام التي لم تصل السقف
      .sort((a,b)=> a.hasMuscle-b.hasMuscle || a.count-b.count);

      if(!dayScores.length) break; // كل الأيام وصلت السقف — نتوقف

      const targetDay=plan[dayScores[0].idx];
      targetDay.exercises.push({...pick, video:videoLinks[pick.id]||""});
      used.add(pick.id);

      // إعادة ترتيب علمي
      const gOrder={};
      (targetDay.groups||[]).forEach((g,i)=>gOrder[g]=(BIG_GROUPS.includes(g)?0:100)+i);
      if(gOrder[muscle]===undefined) gOrder[muscle]=BIG_GROUPS.includes(muscle)?50:150;
      targetDay.exercises.sort((a,b)=>{
        const go=(gOrder[a.group]??75)-(gOrder[b.group]??75);
        if(go!==0) return go;
        return (a.type==="compound"?0:1)-(b.type==="compound"?0:1);
      });
    }
  });

  // ===== سقف منطقة غير التركيز =====
  // عند اختيار تركيز معيّن، نتأكد أن العضلات المركّز عليها تبقى الأعلى فعلياً
  // بتقليص العضلات غير المركّز عليها إذا تجاوزت (مع احترام الحد الأدنى المطلق).
  const focusMuscles = (FOCUS[S.focus]?.muscles)||[];
  if(focusMuscles.length){
    // أقل عدد تمارين للعضلة المركّز عليها (الكبيرة)
    const focusBigSets = 18;
    const focusMinEx = Math.ceil(focusBigSets/setsPer);
    // سقف العضلات غير المركّز عليها = أقل من تمارين منطقة التركيز
    const capBig = Math.max(Math.ceil(10/setsPer), focusMinEx-1);   // لا يقل عن الحد الأدنى 10
    const capSmall = Math.max(Math.ceil(8/setsPer), focusMinEx-1);

    COVERAGE_MUSCLES.forEach(muscle=>{
      if(focusMuscles.includes(muscle)) return; // لا نقصّ منطقة التركيز
      const cap = BIG_GROUPS.includes(muscle) ? capBig : capSmall;
      // نحسب تمارين هذه العضلة ونقصّ الزائد (نزيل من أكثر الأيام ازدحاماً)
      let count = exCount()[muscle]||0;
      while(count > cap){
        // نجد يوماً يحتوي العضلة، ونزيل آخر تمرين لها (عزل غالباً)
        let removed=false;
        const dayIdxs=plan.map((d,i)=>({i,n:d.exercises.filter(e=>e.group===muscle).length}))
                          .filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
        for(const {i} of dayIdxs){
          const arr=plan[i].exercises;
          // نزيل تمرين عزل أولاً (للحفاظ على المركّب)
          let ri=-1;
          for(let k=arr.length-1;k>=0;k--){ if(arr[k].group===muscle && arr[k].type==="isolation"){ri=k;break;} }
          if(ri<0) for(let k=arr.length-1;k>=0;k--){ if(arr[k].group===muscle){ri=k;break;} }
          if(ri>=0){ arr.splice(ri,1); removed=true; break; }
        }
        if(!removed) break;
        count--;
      }
    });
  }
}

/* تضمن أن كل عضلة في قائمة التغطية تظهر أسبوعياً بحدها الأدنى.
   إذا وُجدت عضلة مهملة، تضيف لها أفضل تمرين متاح في يوم مناسب. */
function ensureFullCoverage(plan, danger, used){
  const appearance={};
  COVERAGE_MUSCLES.forEach(m=>appearance[m]=0);
  plan.forEach(day=>{
    const seen=new Set();
    day.exercises.forEach(e=>seen.add(e.group));
    seen.forEach(g=>{ if(appearance[g]!==undefined) appearance[g]++; });
  });

  COVERAGE_MUSCLES.forEach(muscle=>{
    const need=(MIN_WEEKLY_APPEARANCE[muscle]||1);
    if(appearance[muscle]>=need) return; // مغطّاة

    // نبحث عن تمرين متاح لهذه العضلة
    const pool=EX.filter(e=>
      e.group===muscle &&
      e.env.includes(S.env) &&
      e.level<=S.level &&
      !S.no.has(e.id) &&
      !e.risk.some(r=>danger.has(r))
    );
    if(!pool.length) return; // لا يوجد تمرين متاح (مثلاً مستبعد كلياً) — نحترم رغبة المدربة

    // نختار التمرين: المفضّل أولاً ثم المركّب
    pool.sort((a,b)=>{
      const fa=S.fav.has(a.id)?0:1, fb=S.fav.has(b.id)?0:1;
      if(fa!==fb) return fa-fb;
      return (a.type==="compound"?0:1)-(b.type==="compound"?0:1);
    });
    const pick = pool.find(e=>!used.has(e.id)) || pool[0];

    // نضيفه لليوم الأنسب: نفضّل يوماً بنفس النمط ولم يتجاوز (العدد + 1)، وإلا الأقل ازدحاماً
    const isBig=BIG_GROUPS.includes(muscle);
    const pat = pick.pattern;
    const dayCap = S.dailyCount + 1;
    const notFull = plan.map((d,idx)=>({idx,d})).filter(x=>x.d.exercises.length<dayCap);
    const pool2 = notFull.length ? notFull.map(x=>x.idx) : plan.map((d,idx)=>idx);
    const dayScores=pool2.map(idx=>{
      const d=plan[idx];
      const samePattern=d.exercises.some(e=>e.pattern===pat)?0:1;
      return {idx, samePattern, count:d.exercises.length};
    }).sort((a,b)=> a.samePattern-b.samePattern || a.count-b.count);

    const targetDay=plan[dayScores[0].idx];
    targetDay.exercises.push({...pick, video:videoLinks[pick.id]||""});
    used.add(pick.id);

    // نعيد ترتيب اليوم علمياً (كبير قبل صغير، مركّب قبل عزل)
    const gOrder={};
    (targetDay.groups||[]).forEach((g,i)=>gOrder[g]=(BIG_GROUPS.includes(g)?0:100)+i);
    if(gOrder[muscle]===undefined) gOrder[muscle]=isBig?50:150;
    targetDay.exercises.sort((a,b)=>{
      const go=(gOrder[a.group]??75)-(gOrder[b.group]??75);
      if(go!==0) return go;
      return (a.type==="compound"?0:1)-(b.type==="compound"?0:1);
    });
    appearance[muscle]++;
  });
}

/* حساب الحجم الأسبوعي (عدد المجموعات لكل عضلة) + تحقق علمي */
function computeWeeklyVolume(plan){
  const L=loadParams();
  const setsPer = parseInt(L.sets,10)||3;
  const vol={}; // group -> مجموع المجموعات أسبوعياً
  let push=0, pull=0;
  plan.forEach(day=>{
    day.exercises.forEach(e=>{
      vol[e.group]=(vol[e.group]||0)+setsPer;
      if(e.pattern==="push") push+=setsPer;
      else if(e.pattern==="pull") pull+=setsPer;
    });
  });
  // تحقق: نسبة الدفع/السحب، والحجم لكل عضلة
  const [minV,maxV]=L.weekVol;
  const warnings=[];
  const ratio = pull>0 ? push/pull : (push>0?99:1);
  const balanced = ratio<=1.6 && ratio>=0.6; // ضمن النطاق المقبول
  return { vol, push, pull, ratio, balanced, minV, maxV };
}

/* ---------- التوليد بالذكاء الاصطناعي ---------- */
async function generateAI(){
  // الذكاء الاصطناعي يحتاج خادماً (Vercel)؛ لا يعمل من ملف محلي
  if(location.protocol==="file:"){
    alert("🤖 التوليد بالذكاء الاصطناعي يعمل فقط بعد نشر البرنامج على Vercel (راجعي دليل النشر).\n\nسيتم الآن استخدام التوليد السريع.");
    generate(); return;
  }
  const btn=document.querySelector('[data-act="generateAI"]');
  const orig = btn ? btn.textContent : "";
  if(btn){ btn.textContent="🤖 يفكّر..."; btn.disabled=true; }

  // التمارين المتاحة لبيئة العميل ومستواه (نرسلها للذكاء ليختار منها)
  const danger=dangerSet();
  const available = EX
    .filter(e=> e.env.includes(S.env) && e.level<=S.level && !S.no.has(e.id) && !e.risk.some(r=>danger.has(r)))
    .map(e=>({id:e.id, name:e.name, group:e.group, muscle:e.muscle, level:e.level, fav:S.fav.has(e.id)}));

  try{
    const resp = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        client:S.client, env:S.env, level:S.level, days:S.days,
        split:S.split, dailyCount:S.dailyCount, conditions:S.conditions,
        goal:S.goal, aiRequest:S.aiRequest, available,
        minDaily:S.minDaily, maxDaily:S.maxDaily,
        weeklyTargets: Object.fromEntries(COVERAGE_MUSCLES.map(m=>[m,targetWeeklySets(m)])),
        gluteEmphasis: S.gluteEmphasis
      })
    });
    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      throw new Error(err.error || "تعذّر الاتصال بالذكاء الاصطناعي");
    }
    const data = await resp.json();
    if(!data.plan || !Array.isArray(data.plan)) throw new Error("ناتج غير متوقع من الذكاء");

    /* جدول الذكاء يُنفَّذ كما هو: نفس التمارين وبنفس الترتيب.
       المحرك يضيف الوصفة والإحماء والإطالة والتقرير فقط، ولا يعيد الترتيب.
       إعادة الترتيب كانت تُلغي أي تسلسل تطلبه المدربة في نص الطلب. */
    const exById = Object.fromEntries(EX.map(e=>[e.id,e]));
    const used = new Set();
    const seen = {};
    S.plan = data.plan.map(day=>{
      const list = (day.exerciseIds||[]).map(id=>exById[id]).filter(Boolean);
      list.forEach(e=>used.add(e.id));
      const groups = [...new Set(list.map(e=>e.group))];
      groups.forEach(g=>{ seen[g]=(seen[g]||0)+1; });
      return {
        groups,
        title: day.title || groups.map(g=>DAY_NAMES[g]).join(" + "),
        exercises: list.map((e,i)=>{
          const sch = schemeFor(e);
          /* إن حدّد الذكاء مجموعات أو تكرارات (لأن المدربة كتبتها في طلبها)
             فهي الأولى، ووصفة المحرك تُستخدم فقط لما لا يُحدَّد شيء.
             استبدال أرقام المدربة بوصفتي كان يُفرغ طلبها من معناه. */
          const req = (day.prescriptions || [])[i] || {};
          if(req.sets) sch.sets = Math.min(6, Math.max(1, parseInt(req.sets,10) || sch.sets));
          if(req.reps) sch.reps = String(req.reps).slice(0,12);
          else if(seen[e.group] === 2) sch.reps = shiftReps(sch.reps);
          sch.baseSets = sch.sets;
          return Object.assign({}, e, sch, {video: videoLinks[e.id]||""});
        })
      };
    }).filter(d=>d.exercises.length);

    if(!S.plan.length) throw new Error("لم يُنتج الذكاء جدولاً صالحاً");

    /* جدول الذكاء يُحترم كما هو: لا إضافة ولا حذف.
       الطلب الصريح للمدربة أولى من أهداف الحجم، والحجم يُقاس ويُعرض
       في التقرير لتقرّر هي، لا ليُعدَّل الجدول من تحت يدها. */
    const report = { advice:null, shortfalls:[], fixes:[], volume: volumeReport(S.plan) };
    report.volume.forEach(v=>{
      if(!v.ok) report.shortfalls.push({muscle:v.muscle, got:v.effective, target:v.target,
        direct:v.direct, dmin:v.dmin, fix:"جدول الذكاء مُحترم كما هو — عدّلي الطلب إن أردتِ رفع الحجم"});
    });
    S.plan.forEach(d=>{ d.warmup=buildWarmup(d); d.cooldown=buildCooldown(d); });
    report.balance     = balanceAudit(S.plan);
    report.progression = progressionBlock();
    report.tracking    = trackingSheet(S.plan);
    report.source      = "ai";
    S.report = report;
    S.weekly = computeWeeklyVolume(S.plan);
    go(3);
  }catch(e){
    alert("تعذّر التوليد بالذكاء الاصطناعي:\n"+e.message+"\n\nسيتم استخدام التوليد السريع بدلاً منه.");
    generate(); // احتياطي: التوليد المنطقي العادي
  }finally{
    if(btn){ btn.textContent=orig; btn.disabled=false; }
  }
}
let videoLinks={};
/* روابط المكتبة تُحمَّل مسبقاً: كل تمرين إحماء أو إطالة له رابطه الحقيقي
   دون أن تُدخليه يدوياً. ما تحفظينه بنفسك يبقى له الأولوية. */
function seedLibraryVideos(){
  [].concat(EX, WARM, FLEX).forEach(x=>{ if(x.video && !videoLinks[x.id]) videoLinks[x.id]=x.video; });
}
function loadStored(){
  try{
    const su=localStorage.getItem("zf_subs_url"); if(su) S.subsUrl=su;
    const im=localStorage.getItem("zf_images"); if(im) S.images=JSON.parse(im);
    const vl=localStorage.getItem("zf_videos"); if(vl) videoLinks=JSON.parse(vl);
  }catch(e){}
  seedLibraryVideos();
}
function saveImages(){
  try{
    localStorage.setItem("zf_images",JSON.stringify(S.images));
  }catch(e){
    alert("⚠️ مساحة الحفظ ممتلئة. حاولي حذف صور غير مستخدمة أو استخدام صور أصغر حجماً.");
  }
}
/* ملف إعدادات محمول: يحمل الصور والروابط بين الأجهزة دون خادم.
   صدّريه من جهاز واستورديه في الآخر — أبسط حل يعمل حتى بلا إنترنت. */
function exportSettings(){
  const data = { v:4, exportedAt:new Date().toISOString(), images:S.images, videoLinks };
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "zahraafit-settings.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importSettings(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d.images)     { S.images = Object.assign({}, S.images, d.images); saveImages(); }
      if(d.videoLinks) { videoLinks = Object.assign({}, videoLinks, d.videoLinks); saveVideos(); }
      alert("✅ استُوردت الإعدادات: "+Object.keys(d.images||{}).length+" صورة و"+Object.keys(d.videoLinks||{}).length+" رابط.");
      render();
    }catch(e){ alert("⚠️ الملف غير صالح."); }
  };
  r.readAsText(file);
}
function saveVideos(){ try{localStorage.setItem("zf_videos",JSON.stringify(videoLinks));}catch(e){} }

/* ---------- إدارة روابط الفيديو (نافذة بسيطة) ---------- */
function editVideos(){
  const exById=Object.fromEntries(EX.map(e=>[e.id,e]));
  const danger=dangerSet();
  // 1) تمارين الجدول
  const planIds=[...new Set(S.plan.flatMap(d=>d.exercises.map(e=>e.id)))];
  // 2) تمارين الإحماء
  const warmIds=[...WARMUP.upper.items, ...WARMUP.lower.items];
  const flexIds=[...STRETCH.upper.items, ...STRETCH.lower.items];
  // 3) تمارين المكتبة (البدائل = خارج الجدول، متاحة للبيئة والمستوى)
  const planSet=new Set(planIds);
  const libIds=EX.filter(e=>
    e.env.includes(S.env) && e.level<=S.level &&
    !e.risk.some(r=>danger.has(r)) && !planSet.has(e.id)
  ).map(e=>e.id);

  const section=(title,sub)=>`<div style="margin-top:22px;margin-bottom:6px">
    <div style="font-family:'Cairo';font-weight:800;font-size:16px;color:var(--navy)">${title}</div>
    <div style="font-size:12.5px;color:var(--muted);font-weight:600">${sub}</div></div>`;
  const fieldFor=(id,name)=>`<div class="field"><label>${name}</label>
      <input data-vid="${id}" value="${videoLinks[id]||""}" placeholder="https://youtube.com/watch?v=..."></div>`;

  let html=`<div class="app"><div class="screen on"><div class="card">
    <div class="sec-head"><div class="ico">🔗</div><div><h2>روابط الفيديو</h2>
    <p>ألصقي رابط يوتيوب لأي تمرين في الجدول أو الإحماء أو المكتبة. يظهر زر التشغيل ▶ في الـ PDF فور الحفظ.</p></div></div>`;

  html+=section("🏋️ تمارين الجدول","التمارين الموجودة في برنامج العميل الحالي");
  html+=`<div style="display:grid;gap:10px">`;
  planIds.forEach(id=>{ const e=exById[id]; if(e) html+=fieldFor(id,e.name); });
  html+=`</div>`;

  html+=section("🔥 تمارين الإحماء","إحماء علوي وسفلي");
  html+=`<div style="display:grid;gap:10px">`;
  warmIds.forEach(it=>{ html+=fieldFor(it[0], it[1]); });
  html+=`</div>`;

  html+=section("🧘 تمارين الإطالة","الإطالة بعد التمرين — مربوطة بالمكتبة");
  html+=`<div style="display:grid;gap:10px">`;
  flexIds.forEach(it=>{ html+=fieldFor(it[0], it[1]); });
  html+=`</div>`;

  html+=section("📚 تمارين المكتبة (البدائل)","التمارين البديلة خارج الجدول");
  html+=`<div style="display:grid;gap:10px">`;
  libIds.forEach(id=>{ const e=exById[id]; if(e) html+=fieldFor(id,e.name); });
  html+=`</div>`;

  // تمارين الدعم للحالات الصحية المختارة
  if(S.conditions.length){
    S.conditions.forEach(cid=>{
      const sup=SUPPORT[cid];
      if(!sup) return;
      html+=section(`${sup.ico} ${sup.name}`,"تمارين الدعم والتأهيل لهذه الحالة");
      html+=`<div style="display:grid;gap:10px">`;
      sup.items.forEach((it,i)=>{ html+=fieldFor(`sup_${cid}_${i}`, it[0]); });
      html+=`</div>`;
    });
  }

  html+=`<div class="actions" style="margin-top:24px"><button class="btn line" data-act="backplan">→ رجوع للجدول</button>
    <button class="btn primary" data-act="savevideos">💾 حفظ الروابط</button></div></div></div></div>`;
  document.getElementById("root").innerHTML=topbar()+html;
  bind();
}

/* ورقة أنماط الـPDF: تعريف واحد لكل عضلة، والصفوف تشير إليه بالصنف. */
function pdfMuscleCSS(){
  const keys = IMAGE_SLOTS.map(s=>s[0]);
  const rules = keys.map(k=>{
    const src = BUILTIN_THUMBS[k] || S.images[k] || (remoteImages[k]||"");
    return src ? `.mi-${k}{background-image:url('${src}')}` : "";
  }).filter(Boolean).join("\n");
  return `<style>
    .mi{width:50px;height:50px;border-radius:9px;background:#fff;border:1px solid #e3e7ee;
        background-size:contain;background-repeat:no-repeat;background-position:center;flex:none}
    /* قواعد الطباعة: الصف والبطاقة والملاحظة لا تُقصّ بين صفحتين */
    tr{page-break-inside:avoid}
    h1,h2,h3{page-break-after:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @media print{
      tr{page-break-inside:avoid}
      table{page-break-inside:auto}
    }
    ${rules}
  </style>`;
}
function pdfMuscleBox(muscle, size){
  const sz = size ? `width:${size}px;height:${size}px;` : "";
  const has = BUILTIN_THUMBS[muscle] || S.images[muscle] || remoteImages[muscle];
  return has ? `<div class="mi mi-${muscle}" style="${sz}"></div>`
             : `<div class="mi" style="${sz}display:flex;align-items:center;justify-content:center;font-size:10px;color:#8294b8;text-align:center;padding:3px">${(MUSCLES[muscle]||"")}</div>`;
}

        <div style="page-break-inside:avoid;background:#eef4ff;border:1px solid #c9dcff;border-radius:14px;padding:14px 18px;margin-top:16px;display:flex;gap:10px;align-items:flex-start">

      </div>
    </div>`;
  }

  // ===== صفحة تمارين المرونة (التبريد) =====
  let stretch="";
  if(S.includeEdu){
    const stretchItem=(id,name,desc)=>{
      const vid=videoLinks[id]||"";
      const playBtn=vid?`<a href="${vid}" style="flex:none;text-decoration:none"><span style="display:inline-block;background:#ff0000;color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px">▶ فيديو</span></a>`:"";
      return `<div style="page-break-inside:avoid;display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f2f6">
        <span style="font-size:18px;flex:none;color:${orange}">🧘‍♀️</span>
        <div style="flex:1">
          <div style="font-family:Cairo;font-weight:700;font-size:14.5px;color:${navy};margin-bottom:2px">${name}</div>
          <div style="font-size:12.5px;color:#56627a;font-weight:600;line-height:1.7">${desc}</div>
        </div>
        ${playBtn}
      </div>`;
    };
    const stretchSection=(sec)=>`
      <div style="margin-bottom:16px">
        <div style="font-family:Cairo;font-weight:800;font-size:15px;color:${orange};margin-bottom:4px">${sec.name}</div>
        <div style="font-size:11.5px;color:#94a0b4;font-weight:600;margin-bottom:8px">${sec.sub}</div>
        ${sec.items.map(it=>stretchItem(it[0],it[1],it[2])).join("")}
      </div>`;

    stretch=`<div style="page-break-before:always;page-break-inside:avoid;padding:44px 48px">
      <div style="text-align:center;margin-bottom:8px">
        <span style="font-family:Cairo;font-weight:900;font-size:13px;color:${orange};letter-spacing:2px">ZAHRAAFIT · التبريد</span>
      </div>
      <h1 style="font-family:Cairo;font-weight:900;font-size:30px;color:${navy};text-align:center;margin-bottom:6px">🧘‍♀️ تمارين المرونة والإطالة</h1>
      <div style="width:90px;height:4px;background:${orange};border-radius:4px;margin:0 auto 14px"></div>
      <p style="text-align:center;color:#6a7488;font-size:13px;font-weight:600;max-width:580px;margin:0 auto 20px;line-height:1.8">أدّي الإطالات بعد التمرين مباشرة والعضلات دافئة. تحسّن المرونة، تقلّل الشدّ والألم، وتسرّع الاستشفاء. لا تندفعي — إطالة هادئة حتى تشعرين بشدّ مريح دون ألم.</p>
      <div style="max-width:600px;margin:0 auto">
        ${stretchSection(STRETCH.upper)}
        ${stretchSection(STRETCH.lower)}
        <div style="page-break-inside:avoid;background:#eef4ff;border:1px solid #c9dcff;border-radius:12px;padding:12px 16px;margin-top:8px;font-size:12px;color:#33476b;font-weight:600;line-height:1.8">
          💡 اثبتي في كل إطالة 20–30 ثانية دون اهتزاز، وتنفّسي بعمق. كرّري كل إطالة مرة أو مرتين. لا تُطيلي على عضلة مصابة.
        </div>
      </div>
    </div>`;
  }

  /* ===== الإرجاع المفقود =====
     الدالة كانت تبني كل الصفحات في متغيرات ثم تنتهي بلا return،
     فكان التصدير يُخرج "undefined". هذا يجمعها بالترتيب الصحيح. */
  /* الترتيب: الغلاف أولاً ثم التعليمات، ثم أيام الجدول.
     ملاحظة: disc = تنويه الحالات الصحية + الملخص العلمي (summary بداخله)،
     فلا يُضاف summary معه وإلا تكرّر جدول الحجم الأسبوعي مرتين. */
  /* الـPDF بأكمله موجّه للعميل، فيمرّ على محوّل الصياغة دفعة واحدة.
     الرموز اللاتينية (روابط، CSS) لا تتأثر لأن القواعد عربية بحتة. */
  /* الخلفية على حاوية واحدة تلف كل الصفحات: الكتلة التي تمتد على عدة صفحات
     تُرسم خلفيتها في كل صفحة. وضعها على أقسام المحتوى كان يلوّن صندوق
     المحتوى فقط فيظهر نصف الصفحة ملوّناً ونصفها أبيض. */
  const __pages = gt([pdfMuscleCSS(), cover, intro, body, disc, warmup, stretch, cardio, support, library, edu, rights]
         .filter(Boolean).join("\n"));
  return `<div style="background:#eef1f7;-webkit-print-color-adjust:exact;print-color-adjust:exact">${__pages}</div>`;
}

/* تصدير عبر نافذة طباعة نظيفة — مضمون بأي متصفح، بدون مكتبات */
function exportViaPrintWindow(){
  const css=`
    @page{ size:A4; margin:0; }
    *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; box-sizing:border-box; margin:0; }
    html,body{ font-family:'Tajawal',sans-serif; background:#fff; width:100%; }
    .pbar{ position:fixed; top:0; left:0; right:0; background:#0f1f3d; color:#fff; padding:14px;
           text-align:center; font-family:'Tajawal'; font-weight:700; z-index:99; box-shadow:0 2px 10px rgba(0,0,0,.2); }
    .pbar button{ background:#e8622c; color:#fff; border:none; padding:10px 26px; border-radius:10px;
                  font-family:'Cairo'; font-weight:800; font-size:15px; cursor:pointer; margin:8px 6px 0; }
    .pbar button.sec{ background:rgba(255,255,255,.16); }
    .pbar small{ display:block; opacity:.8; font-weight:500; font-size:12px; margin-top:4px }
    @media print{ .pbar,.noprint{ display:none!important; } body{ padding:0!important; } }
  `;
  const w=window.open("","_blank","width=900,height=1000");
  if(!w){ alert("المتصفح منع فتح النافذة. اسمحي بالنوافذ المنبثقة (Pop-ups) لهذا الموقع ثم حاولي مجدداً."); return; }
  const safeName=(S.client.name||"جدول").replace(/[<>"'&]/g,"");
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZahraaFit — ${safeName}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>html,body{background:#fff!important;}${css}</style></head><body style="background:#fff">
    <div class="pbar noprint">📄 الجدول جاهز
      <small>اضغطي الزر، وفي نافذة الطباعة اختاري «حفظ بصيغة PDF» وفعّلي «الرسوم الخلفية»</small>
      <button onclick="doPrint()">🖨️ حفظ كـ PDF</button>
      <button class="sec" onclick="window.close()">إغلاق</button></div>
    <div style="height:86px" class="noprint"></div>
    ${buildPdfHTML()}
    <script>
      function doPrint(){ window.focus(); window.print(); }
    <\/script>
    </body></html>`;
  w.document.open();
  w.document.write(html);
  w.document.close();
}

function exportPDF(){
  if(typeof window.html2pdf==="undefined"){
    alert("سيتم استخدام طباعة المتصفح. فعّلي خيار «الرسوم الخلفية / Background graphics» لظهور الألوان.");
    window.print(); return;
  }
  const btn=document.querySelector('[data-act="exportpdf"]');
  if(btn){ btn.textContent="⏳ جارٍ التجهيز..."; btn.disabled=true; }

  // طبقة عرض مرئية فعلياً (وراء واجهة معتمة) — تفادياً لمشكلة الصفحات الفارغة
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(15,31,61,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px";
  overlay.innerHTML=`<div style="color:#fff;font-family:Tajawal,sans-serif;font-weight:700;font-size:17px">⏳ جارٍ إنشاء ملف PDF...</div>`;
  const stage=document.createElement("div");
  stage.style.cssText="position:fixed;top:0;left:0;width:794px;background:#fff;z-index:1;opacity:0.01;pointer-events:none";
  stage.innerHTML=buildPdfHTML();
  document.body.appendChild(stage);
  document.body.appendChild(overlay);

  const fname=`ZahraaFit_${(S.client.name||"جدول").replace(/\s+/g,"_")}.pdf`;
  const target=stage.firstElementChild;

  const finish=()=>{
    if(stage.parentNode) document.body.removeChild(stage);
    if(overlay.parentNode) document.body.removeChild(overlay);
    if(btn){ btn.textContent="⬇️ تحميل PDF"; btn.disabled=false; }
  };

  // مهلة بسيطة لضمان تحميل الصور قبل التصوير
  setTimeout(()=>{
    window.html2pdf().set({
      margin:0,
      filename:fname,
      image:{type:"jpeg",quality:0.97},
      html2canvas:{scale:2,useCORS:true,allowTaint:true,backgroundColor:"#ffffff",
                   windowWidth:794, scrollX:0, scrollY:0},
      jsPDF:{unit:"px",format:[794,1123],orientation:"portrait",hotfixes:["px_scaling"]},
      pagebreak:{mode:["css","legacy"]}
    }).from(target).save()
      .then(finish)
      .catch(()=>{ finish(); alert("تعذّر إنشاء الملف. حاولي مرة أخرى أو استخدمي طباعة المتصفح."); });
  }, 350);
}


function bind(){
  const $=s=>document.querySelector(s);
  const $$=s=>document.querySelectorAll(s);

  const impEl=document.getElementById("imp-settings");
  if(impEl) impEl.onchange=e=>{ if(e.target.files[0]) importSettings(e.target.files[0]); };
  $$("[data-sub]").forEach(el=>el.onclick=()=>applySubscriber(+el.dataset.sub));
  $$("[data-subfilter]").forEach(el=>el.onclick=()=>{ S.subsFilter=el.dataset.subfilter; render(); });
  $$("[data-flextab]").forEach(el=>el.onclick=()=>{ S.flexTab=el.dataset.flextab; render(); });
  $$("[data-mind]").forEach(el=>el.onclick=()=>{ S.minDaily=+el.dataset.mind; render(); });
  $$("[data-maxd]").forEach(el=>el.onclick=()=>{ S.maxDaily=+el.dataset.maxd; render(); });
  $$("[data-glute]").forEach(el=>el.onclick=()=>{ S.gluteEmphasis=el.dataset.glute==="1"; render(); });
  $$("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="start") go(0);
    else if(a==="to0") go(0);
    else if(a==="to1"){ saveClient(); go(1); }
    else if(a==="to2"){ const ai=document.getElementById("ai-request"); if(ai) S.aiRequest=ai.value.trim(); go(2); }
    else if(a==="generate") generate();
    else if(a==="generateAI"){ const ai=document.getElementById("ai-request"); if(ai) S.aiRequest=ai.value.trim(); generateAI(); }
    else if(a==="print") window.print();
    else if(a==="exportprint") exportViaPrintWindow();
    else if(a==="toggleedu"){ S.includeEdu=!S.includeEdu; render(); }
    else if(a==="exportpdf") exportPDF();
    else if(a==="restart"){ if(confirm("بدء جدول جديد؟ ستُحذف اختياراتك الحالية (الصور تبقى محفوظة).")){ resetPlan(); go(-1);} }
    else if(a==="subs"){ S._back=S.step; go(13); }
    else if(a==="fetchsubs"){ const el=document.getElementById("subs-url"); if(el) S.subsUrl=el.value.trim(); fetchSubscribers(); }
    else if(a==="pastesubs"){ S.subsPaste=""; render(); }
    else if(a==="parsesubs"){
      const el=document.getElementById("subs-text");
      try{ loadSubsFromText(el?el.value:""); }
      catch(e){ subsErr="تعذّر التحليل: "+e.message; render(); }
    }
    else if(a==="exportsettings") exportSettings();
    else if(a==="warmup"){ S._back=S.step; go(11); }
    else if(a==="flex"){ S._back=S.step; go(12); }
    else if(a==="tosetup") go(1);
    else if(a==="images"){ S._back=S.step; go(9); }
    else if(a==="videos"){ S._back=S.step; videoFilter=""; go(10); }
    else if(a==="closevideos") go(S._back??-1);
    else if(a==="closeimg") go(S._back??-1);
    else if(a==="editvideos") editVideos();
    else if(a==="backplan") go(3);
    else if(a==="savevideos"){ $$("[data-vid]").forEach(i=>{ const v=i.value.trim(); if(v) videoLinks[i.dataset.vid]=v; else delete videoLinks[i.dataset.vid]; }); saveVideos(); generate(); }
  });

  // الجنس
  $$("[data-gender]").forEach(el=>el.onclick=()=>{ S.client.gender=el.dataset.gender; render(); });
  // بيئة / مستوى / أيام
  $$("[data-env]").forEach(el=>el.onclick=()=>{ S.env=el.dataset.env; render(); });
  $$("[data-split]").forEach(el=>el.onclick=()=>{ S.split=el.dataset.split; render(); });
  $$("[data-goal]").forEach(el=>el.onclick=()=>{ S.goal=el.dataset.goal; render(); });
  $$("[data-focus]").forEach(el=>el.onclick=()=>{ S.focus=el.dataset.focus; render(); });
  $$("[data-level]").forEach(el=>el.onclick=()=>{ S.level=+el.dataset.level; render(); });
  $$("[data-days]").forEach(el=>el.onclick=()=>{ S.days=+el.dataset.days; render(); });
  $$("[data-daily]").forEach(el=>el.onclick=()=>{ S.dailyCount=+el.dataset.daily; render(); });
  // الحالات الصحية
  $$("[data-cond]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.cond;
    S.conditions.includes(id) ? S.conditions=S.conditions.filter(x=>x!==id) : S.conditions.push(id);
    render();
  });
  // منتقي التمارين
  $$("[data-tab]").forEach(el=>el.onclick=()=>{ pickerTab=el.dataset.tab; render(); });
  $$("[data-fav]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.fav;
    if(S.fav.has(id)) S.fav.delete(id); else { S.fav.add(id); S.no.delete(id); }
    render();
  });
  $$("[data-no]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.no;
    if(S.no.has(id)) S.no.delete(id); else { S.no.add(id); S.fav.delete(id); }
    render();
  });
  // الصور
  $$("[data-slot]").forEach(el=>el.onclick=(ev)=>{
    if(ev.target.dataset.delimg) return;
    const k=el.dataset.slot;
    const inp=document.createElement("input");
    inp.type="file"; inp.accept="image/*";
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        // نضغط الصورة قبل الحفظ لتفادي تجاوز حد التخزين
        const img=new Image();
        img.onload=()=>{
          // الغلاف أكبر (عرض 1000)، باقي الصور (عرض 600)
          const maxW = (k==="cover") ? 1000 : 600;
          let w=img.width, h=img.height;
          if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
          const canvas=document.createElement("canvas");
          canvas.width=w; canvas.height=h;
          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0,w,h);
          // PNG للشعار (يحافظ على الشفافية)، JPEG للباقي (أصغر حجماً)
          const out = (k==="logo")
            ? canvas.toDataURL("image/png")
            : canvas.toDataURL("image/jpeg",0.82);
          try{
            S.images[k]=out; saveImages(); render();
          }catch(err){
            alert("تعذّر حفظ الصورة (قد تكون كبيرة جداً). جرّبي صورة أصغر.");
          }
        };
        img.onerror=()=>{ S.images[k]=r.result; saveImages(); render(); };
        img.src=r.result;
      };
      r.readAsDataURL(f);
    };
    inp.click();
  });
  $$("[data-delimg]").forEach(el=>el.onclick=(ev)=>{
    ev.stopPropagation(); delete S.images[el.dataset.delimg]; saveImages(); render();
  });

  // مكتبة الفيديوهات: حفظ تلقائي عند الكتابة
  $$("[data-vidlib]").forEach(inp=>{
    inp.oninput=()=>{
      const id=inp.dataset.vidlib, v=inp.value.trim();
      if(v) videoLinks[id]=v; else delete videoLinks[id];
      saveVideos();
    };
  });
  // بحث المكتبة (يحدّث عند الضغط Enter أو فقدان التركيز لتفادي إعادة الرسم أثناء الكتابة)
  const vsearch=document.getElementById("vid-search");
  if(vsearch){
    vsearch.onkeydown=(e)=>{ if(e.key==="Enter"){ videoFilter=vsearch.value.trim(); render(); } };
    vsearch.onblur=()=>{ if(vsearch.value.trim()!==videoFilter){ videoFilter=vsearch.value.trim(); render(); } };
  }
}

function saveClient(){
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  S.client.name=v("f-name"); S.client.age=v("f-age");
  S.client.height=v("f-height"); S.client.weight=v("f-weight");
}
function resetPlan(){
  S.client={name:"",age:"",height:"",weight:"",gender:S.client.gender};
  S.env="gym"; S.level=1; S.days=4; S.dailyCount=6; S.conditions=[];
  S.minDaily=0; S.maxDaily=8; S.gluteEmphasis=true;
  S.fav=new Set(); S.no=new Set(); S.plan=null;
}

/* ---------- 1. خريطة التفعيل ---------- */
/* المجموعة الواحدة تُحتسب 1.0 للعضلة الأساسية و0.5 للمساعدة و0.25 للثانوية.
   بدون هذا، البايسبس يبدو ناقصاً رغم 16 مجموعة تجديف تشغّله في كل أسبوع. */
const CONTRIB_BY_GROUP = {
  chest:     {chest:1, triceps:.5, shoulders:.5},
  back:      {back:1, biceps:.5, shoulders:.25},
  shoulders: {shoulders:1, triceps:.5, chest:.25},
  biceps:    {biceps:1, back:.5},
  triceps:   {triceps:1, chest:.25, shoulders:.25},
  quads:     {quads:1, glutes:.5, adductors:.25, hams:.25},
  hams:      {hams:1, glutes:.5, back:.25},
  glutes:    {glutes:1, hams:.5, quads:.25},
  adductors: {adductors:1, quads:.5, glutes:.5},
  calves:    {calves:1},
  abs:       {abs:1}
};
/* استثناءات حيث القاعدة العامة غير دقيقة */
const CONTRIB_OVERRIDE = {
  deadlift:      {back:1, hams:.75, glutes:.75, quads:.25},
  squat:         {quads:1, glutes:.75, adductors:.5, hams:.25},
  frontsquat:    {quads:1, glutes:.5, abs:.25},

  lunge:         {quads:1, glutes:.75, adductors:.25},

  jumpsquat:     {quads:1, glutes:.5, calves:.5},
  gobletsquat:   {quads:1, glutes:.5, adductors:.5},
  sumosquat:     {quads:1, glutes:.5, adductors:.75},
  sumosquat2:    {adductors:1, quads:.5, glutes:.5},
  plie:          {adductors:1, quads:.5, glutes:.5},
  cossack:       {adductors:1, quads:.75, glutes:.5},
  copenhagen:    {adductors:1, abs:.5},
  sidelunge:     {glutes:1, quads:.5, adductors:.5},
  curtsy:        {glutes:1, quads:.5, adductors:.25},

  glutebridge:   {glutes:1, hams:.5},
  frogpump:      {glutes:1, hams:.25},
  rdl:           {hams:1, glutes:.5, back:.25},
  stiffdl:       {hams:1, glutes:.5, back:.25},
  singleleg:     {hams:1, glutes:.5, abs:.25},
  goodmorning:   {hams:1, glutes:.5, back:.25},
  bwgoodmorning: {hams:1, glutes:.5, back:.25},
  nordic:        {hams:1, glutes:.25},
  pullup:        {back:1, biceps:.5, abs:.25},
  chinup:        {biceps:1, back:.75},
  chinnegative:  {biceps:1, back:.75},
  invertedcurl:  {biceps:1, back:.75},
  latpull:       {back:1, biceps:.5},
  dips:          {chest:1, triceps:.75, shoulders:.25},
  benchdip:      {triceps:1, chest:.25, shoulders:.25},
  closegrippress:{triceps:1, chest:.5, shoulders:.25},
  closegrippush: {triceps:1, chest:.5, shoulders:.25},
